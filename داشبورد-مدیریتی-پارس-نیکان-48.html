/* =========================================================================
   TAB: ضایعات تولید (waste)
   ========================================================================= */
function paretoFrom(items, keyFn, valFn){
  const map = {};
  items.forEach(it=>{ const k = keyFn(it)||'نامشخص'; map[k] = (map[k]||0) + (valFn(it)||0); });
  const arr = Object.entries(map).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value);
  const total = arr.reduce((s,x)=>s+x.value,0);
  let cum = 0;
  arr.forEach(x=>{ cum += x.value; x.pct = total? x.value/total : 0; x.cumPct = total? cum/total : 0; });
  return arr;
}
function renderWaste(){
  const M = monthData();
  const list = [...M.waste].sort((a,b)=>dateSortKey(b.date)-dateSortKey(a.date))
    .filter(x=> (!filters.waste || (x.station+x.part+x.operator+x.wasteType).toLowerCase().includes(filters.waste.toLowerCase()))
             && (filters.wasteCat==='all' || x.category===filters.wasteCat));
  const totalWaste = M.waste.reduce((s,x)=>s+(x.wasteCount||0),0);
  const totalProduced = (()=>{
    const seen = new Set(); let s=0;
    M.waste.forEach(x=>{ const key = x.date+'|'+x.station+'|'+x.part; if(x.produced && !seen.has(key)){ s+=x.produced; seen.add(key);} });
    return s;
  })();
  const wasteRate = totalProduced? totalWaste/totalProduced : 0;
  const totalReworkMin = M.waste.reduce((s,x)=>s+(x.reworkMinutes||0),0);
  const reworkRecords = M.waste.filter(x=>x.reworkMinutes>0 || x.category==='دوباره‌کاری');
  const totalReworkQty = reworkRecords.reduce((s,x)=>s+(x.wasteCount||0),0);
  const reworkLostQtyEst = M.waste.reduce((s,x)=> s + (x.reworkMinutes? (x.reworkMinutes/60)*resolveStationRate(x.station) : 0), 0);
  const stationPareto = paretoFrom(M.waste, x=>x.station, x=>x.wasteCount).slice(0,10);
  const typePareto = paretoFrom(M.waste, x=>x.wasteType, x=>x.wasteCount).slice(0,10);
  const productPareto = paretoFrom(M.waste.filter(x=>x.finalProduct), x=>x.finalProduct, x=>x.wasteCount).slice(0,10);
  const catTotals = paretoFrom(M.waste, x=>x.category, x=>x.wasteCount);
  // تیپ‌ها و انواع ضایعات دیگر ثابت نیستند — خودتان از همین تب می‌توانید گزینه اضافه/حذف کنید
  // (مثلاً «ورودی مشروط» برای قطعاتی که سالم می‌رسند ولی باید قبل از مصرف جدا/غربال شوند).
  const wasteCategories = (DB.meta.wasteCategories && DB.meta.wasteCategories.length) ? DB.meta.wasteCategories : WASTE_CATEGORIES.slice();
  const wasteTypeOptions = (DB.meta.wasteTypeOptions && DB.meta.wasteTypeOptions.length) ? DB.meta.wasteTypeOptions : WASTE_TYPE_LIST_DEFAULT.slice();

  document.getElementById('view').innerHTML = renderMonthBar() + `
  <div class="grid grid-4" style="margin-bottom:16px;">
    ${kpiCard('جمع کل ضایعات ثبت‌شده','عدد', fmt(totalWaste,0), null, '#ff5d6c')}
    ${kpiCard('نرخ ضایعات کل','', pct(wasteRate,2), null, '#ffcf5c')}
    ${kpiCard('پرتکرارترین ایستگاه', '', stationPareto[0]? esc(stationPareto[0].label):'—', null, '#ff9d42', true)}
    ${kpiCard('تعداد ردیف‌های ثبت‌شده','ردیف', fmt(M.waste.length,0), null, '#4c8dff')}
  </div>

  <div class="section-title" style="margin:4px 0 12px;"><span>⏱ زمان دوباره‌کاری و جداسازی این ماه</span><span class="ln"></span></div>
  <div class="grid grid-4" style="margin-bottom:16px;">
    ${kpiCard('⏱ جمع زمان (دوباره‌کاری + جداسازی)','دقیقه', fmt(totalReworkMin,0), null, totalReworkMin>0?'#ff5d6c':'#2fd9c4')}
    ${kpiCard('معادل ساعت کاری ازدست‌رفته','ساعت', fmt(totalReworkMin/60,1), null, '#ff9d42')}
    ${kpiCard('تعداد قطعه دوباره‌کاری/جداسازی‌شده','عدد', fmt(totalReworkQty,0), null, '#ffcf5c')}
    ${kpiCard('برآورد اثر روی ظرفیت تولید','عدد', '~'+fmt(reworkLostQtyEst,0), null, '#ff5d6c')}
  </div>
  ${totalReworkMin>0? `<div class="hint" style="margin:-8px 0 16px;">این ${fmt(totalReworkMin,0)} دقیقه (دوباره‌کاری + جداسازی ورودی مشروط)، معادل برآوردیِ <b>~${fmt(reworkLostQtyEst,0)} عدد</b> ظرفیت تولید ازدست‌رفته است (بر مبنای نرخ استاندارد ساعتی همان ایستگاه) — این عدد قبلاً هیچ‌جای دیگری از داشبورد دیده نمی‌شد. برای ثبت این زمان، کافی است در هر ردیف ضایعات (چه «ورودی مشروط» چه «دوباره‌کاری») فیلد «زمان دوباره‌کاری/جداسازی» را پر کنید.</div>` : ''}

  <div class="card" style="margin-bottom:16px;">
    <h3>${editing.waste? '✏️ ویرایش ردیف ضایعات':'➕ ثبت ضایعات جدید'}</h3>
    <div class="form-grid">
      <div class="field"><label>تاریخ</label>${datePickerHtml('w_date', editing.waste?.date)}</div>

function paretoChart(id, arr, color){
  mkChart(id, { data:{ labels: arr.map(x=>x.label),
      datasets:[
        { type:'bar', label:'تعداد', data: arr.map(x=>x.value), backgroundColor: color, borderRadius:6, order:2, yAxisID:'y' },
        { type:'line', label:'درصد تجمعی', data: arr.map(x=>x.cumPct*100), borderColor:'#4c8dff', backgroundColor:'#4c8dff', pointRadius:3, tension:.25, yAxisID:'y1', order:1, labelFmt:v=>Math.round(v)+'٪' },
      ]},
    options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
      plugins:{ legend:{position:'bottom', labels:{boxWidth:10,padding:14}} },
      scales:{ x:{grid:{display:false}, ticks:{maxRotation:60, minRotation:0, autoSkip:false, font:{size:10}}},
        y:{ position:'left', grid:{color:'#182338'}, title:{display:true, text:'تعداد', color:'#7c8aa5', font:{size:10}} },
        y1:{ position:'right', min:0, max:100, grid:{display:false}, ticks:{callback:v=>v+'٪'}, title:{display:true, text:'درصد تجمعی', color:'#7c8aa5', font:{size:10}} } } }
  });
}

/* =========================================================================
   TAB: شاخص‌های ناب — OEE / MTBF / MTTR (lean)
   Deliberately reuses the exact same figures already computed in
   «تولید خط تولید»، «ضایعات تولید» and «توقفات تولید» — nothing here is a
   separate data source, it's those three tabs recombined into the classic
   Lean/TPM indicators, so a change anywhere flows straight through.
   ========================================================================= */
const SHIFT_HOURS_PER_DAY = 8; // one working shift — same constant used for "روز" duration conversion in توقفات

// محاسبه شاخص‌های OEE/Availability/Performance/Quality/MTBF/MTTR — استفاده مشترک در تب‌های
// «شاخص‌های ناب» و «داشبورد مدیریتی» تا هر دو دقیقاً یک عدد یکسان نشان دهند.
function computeOEE(rows, M){
  const target = DB.meta.lineTarget || LINE_TARGET_DEFAULT;
  const sum4 = rows.reduce((s,e)=>s+mainFourTotal(e),0);
  const targetTotal = rows.reduce((s,e)=>s+dayTarget4Lines(e),0);
  const performance = targetTotal? sum4/targetTotal : null;
  const stationCount = (DB.meta.stations && DB.meta.stations.length)
    ? DB.meta.stations.length
    : Math.max(new Set(M.stop.map(x=>x.station)).size, 1);
  const totalStopHours = M.stop.reduce((s,x)=>s+(x.hours||0),0);
  const stopEvents = M.stop.length;
  const plannedHours = rows.length * SHIFT_HOURS_PER_DAY * stationCount;
  const uptimeHours = Math.max(plannedHours - totalStopHours, 0);
  const availability = plannedHours? uptimeHours/plannedHours : null;
  const mttr = stopEvents? totalStopHours/stopEvents : null;
  const mtbf = stopEvents? uptimeHours/stopEvents : null;
  const totalWaste = M.waste.reduce((s,x)=>s+(x.wasteCount||0),0);
  const totalProduced = (()=>{ const seen=new Set(); let s=0; M.waste.forEach(x=>{ const key=x.date+'|'+x.station+'|'+x.part; if(x.produced&&!seen.has(key)){s+=x.produced; seen.add(key);} }); return s; })();
  const quality = totalProduced? (totalProduced-totalWaste)/totalProduced : null;
  const clamp01 = v=> v===null? 1 : Math.min(1, Math.max(0, v));
  const oee = clamp01(availability) * clamp01(performance) * clamp01(quality);
  return { target, sum4, targetTotal, performance, stationCount, totalStopHours, stopEvents, plannedHours, uptimeHours, availability, mttr, mtbf, totalWaste, totalProduced, quality, oee };
}

function renderLean(){
  const M = monthData();
  const rows = [...M.daily].sort((a,b)=>dateSortKey(a.date)-dateSortKey(b.date));
  const oeeStats = computeOEE(rows, M);
  const { target, sum4, targetTotal, performance, stationCount, totalStopHours, stopEvents, plannedHours, uptimeHours, availability, mttr, mtbf, totalWaste, totalProduced, quality, oee } = oeeStats;
  const productivity = uptimeHours>0? sum4/uptimeHours : null; // پارچه/ساعت کارکرد واقعی

  const stationParetoS = paretoFrom(M.stop, x=>x.station, x=>x.hours).slice(0,6);
  const reasonParetoS = paretoFrom(M.stop, x=>x.reason, x=>x.hours).slice(0,6);
  const stationParetoW = paretoFrom(M.waste, x=>x.station, x=>x.wasteCount).slice(0,6);

  // ---- شاخص‌های تولید و بهره‌وری: تفکیک هر خط + نرخ استفاده از ظرفیت + بهره‌وری نیروی انسانی ----
  const lineLabels = {line1:'خط ۱', line2:'خط ۲', line3:'خط ۳', line4:'خط ۴'};
  const perLine = ['line1','line2','line3','line4'].map(k=>{
    const activeRows = rows.filter(e=>e.lines[k].status!=='stop');
    const sum = activeRows.reduce((s,e)=>s+(e.lines[k].qty||0),0);
    const goal = target*activeRows.length;
    const dev = goal? (sum-goal)/goal : null;
    return { k, label:lineLabels[k], sum, goal, dev, days:activeRows.length };
  });
  const nominalPerLine = DB.meta.nominalCapacity>0 ? DB.meta.nominalCapacity : target;
  const nominalTotal = nominalPerLine*4*rows.length;
  const capacityUtil = nominalTotal? sum4/nominalTotal : null;
  const headcountRows = rows.filter(e=>e.headcount!==null && e.headcount>0);
  const totalPersonDays = headcountRows.reduce((s,e)=>s+e.headcount,0);
  const avgHeadcount = headcountRows.length? totalPersonDays/headcountRows.length : null;
  const sum4Headcounted = headcountRows.reduce((s,e)=>s+mainFourTotal(e),0);
  const productivityPerPerson = totalPersonDays>0 ? sum4Headcounted/totalPersonDays : null;
  const weakestLine = perLine.filter(l=>l.dev!==null).sort((a,b)=>a.dev-b.dev)[0];

  // ---- برنامه‌ریزی نیروی انسانی بر اساس هدف ماهانه ----
  const monthlyTarget = DB.meta.monthlyTarget || 0;
  const workingDays = DB.meta.workingDaysPerMonth || 23;
  const standardHeadcount = DB.meta.standardHeadcount || 0;
  const roster = DB.meta.workforceRoster || [];
  const rosterSum = roster.reduce((s,r)=>s+(r.count||0),0);
  const requiredDailyRate = workingDays? monthlyTarget/workingDays : null;
  const targetProdPerPersonDay = (standardHeadcount>0 && requiredDailyRate!==null)? requiredDailyRate/standardHeadcount : null;
  const targetProdPerPersonMonth = (standardHeadcount>0 && monthlyTarget>0)? monthlyTarget/standardHeadcount : null;
  const workforceAttainment = (targetProdPerPersonDay && productivityPerPerson!==null)? productivityPerPerson/targetProdPerPersonDay : null;

  // ---- بنچمارک صنعت خودرو + هشدار زودهنگام روند (نیمه اول در برابر نیمه دوم بازه) ----
  const halves = dateHalves(rows);
  const stopTrend = halfTrend(M.stop, halves, x=>x.hours||0);
  const wasteTrend = halfTrend(M.waste, halves, x=>x.wasteCount||0);
  const oeeGapAutomotive = oee - INDUSTRY_BENCHMARK.oeeAutomotive;
  const scrapRate = totalProduced? totalWaste/totalProduced : null;

  const insights = [];
  if(availability!==null) insights.push({icon:'🟢', color: availability>=0.9?'#2fd9c4':availability>=0.75?'#ffcf5c':'#ff5d6c',
    text:`دسترس‌پذیری (Availability) خط <b>${pct(availability,1)}</b> است — بر اساس ${fmt(plannedHours,0)} ساعت زمان برنامه‌ریزی‌شده (${rows.length} روز × ${SHIFT_HOURS_PER_DAY} ساعت) منهای <b>${fmt(totalStopHours,1)} ساعت</b> توقف ثبت‌شده در تب «توقفات تولید».`});
  if(stationParetoS[0]) insights.push({icon:'⏸', color:'#ff5d6c', text:`ایستگاه <b>${esc(stationParetoS[0].label)}</b> با <b>${fmt(stationParetoS[0].value,1)} ساعت</b> (${pct(stationParetoS[0].pct,0)} از کل توقفات)، بیشترین اثر منفی روی MTBF را دارد — کاهش تکرار خرابی این ایستگاه مستقیماً MTBF را بالا می‌برد.`});
  if(reasonParetoS[0]) insights.push({icon:'🔧', color:'#ff9d42', text:`شایع‌ترین علت توقف «<b>${esc(reasonParetoS[0].label)}</b>» است (${fmt(reasonParetoS[0].value,1)} ساعت) — اولویت اول ریشه‌یابی برای بهبود MTTR.`});
  if(quality!==null) insights.push({icon:'🎯', color: quality>=0.98?'#2fd9c4':quality>=0.95?'#ffcf5c':'#ff5d6c', text:`نرخ کیفیت <b>${pct(quality,2)}</b> است؛ معادل <b>${fmt(totalWaste,0)} عدد</b> ضایعات از <b>${fmt(totalProduced,0)}</b> تولید ثبت‌شده در تب «ضایعات تولید»${stationParetoW[0]?` — بیشترین سهم از ایستگاه «${esc(stationParetoW[0].label)}».`:'.'}`});
  if(performance!==null) insights.push({icon: performance>=1?'✅':'📉', color: performance>=1?'#2fd9c4':'#ff9d42', text:`کارایی (Performance) تولید نسبت به هدف <b>${pct(performance,1)}</b> است — همان انحراف محاسبه‌شده در تب «تولید خط تولید».`});

function renderFlowmap(){
  const target = DB.meta.lineTarget || LINE_TARGET_DEFAULT;
  const finalOutputTarget = target4Lines(); // هدف پیش‌فرض برای ایستگاه‌های ۴ خط اصلی
  let list = (DB.meta.stations||[]).filter(s=>s.dailyTarget>0);
  const unmeasured = (DB.meta.stations||[]).filter(s=>!s.dailyTarget && s.hasStopIssue);
  list = list.slice().sort((a,b)=>a.dailyTarget-b.dailyTarget);
  const workingDays = DB.meta.workingDaysPerMonth || 23;
  DB.meta.stageTargets = DB.meta.stageTargets || {};

  // ایستگاه‌های بدون «مرحله جریان» دستی، بر اساس نام با نزدیک‌ترین زیرخط تعریف‌شده (CKD/سه‌راهی۲۰۶/
  // درپوش/دیزل) مقایسه می‌شوند، نه صرفاً هدف ۴ خط اصلی — چون این‌ها محصولات/زیرخط‌های جدایی هستند
  // که هرکدام هدف روزانه خودشان را در «تنظیمات واحد» دارند.
  function defaultRequiredForStation(s){
    const n = s.name||'';
    if(/CKD/i.test(n)) return DB.meta.ckdTarget||0;
    if(/سه.?راهی.?۲۰۶|سه.?راهی.?206|206/.test(n)) return DB.meta.se206Target||0;
    if(/درپوش/.test(n)) return DB.meta.darpooshTarget||0;
    if(/دیزل|بنز/.test(n)) return DB.meta.dieselTarget||DIESEL_TARGET_DEFAULT;
    return finalOutputTarget;
  }

  // ایستگاه‌های دارای «مرحله جریان» یکسان (مثل «اتاق قرص») یک زیرخط سریال محسوب می‌شوند —
  // ظرفیت واقعی آن زیرخط، MIN بین اعضایش است (ضعیف‌ترین حلقه)، و هدف موردنیازش می‌تواند با
  // هدف نهایی ۴ خط اصلی فرق کند (مثلاً به‌خاطر ضایعات یا تغذیه چند خط هم‌زمان).
  const stageGroups = {};
  list.forEach(s=>{
    const key = s.stage && s.stage.trim();
    if(key){
      if(!stageGroups[key]) stageGroups[key] = { name:key, stations:[], required: DB.meta.stageTargets[key] || finalOutputTarget };
      stageGroups[key].stations.push(s);
    }
  });
  const ungrouped = list.filter(s=> !(s.stage && s.stage.trim()));
  const requiredFor = s => (s.stage && DB.meta.stageTargets[s.stage.trim()]) || defaultRequiredForStation(s);

  const candidates = [
    ...Object.values(stageGroups).map(g=>{
      const weakest = g.stations.slice().sort((a,b)=>a.dailyTarget-b.dailyTarget)[0];

function renderDash(){


  const M = monthData();
  const rows = [...M.daily].sort((a,b)=>dateSortKey(a.date)-dateSortKey(b.date));
  const target = DB.meta.lineTarget || LINE_TARGET_DEFAULT;
  const ckdTarget = DB.meta.ckdTarget || 0;
  const se206Target = DB.meta.se206Target || 0;
  const darpooshTarget = DB.meta.darpooshTarget || 0;
  const dieselTarget = DB.meta.dieselTarget || DIESEL_TARGET_DEFAULT;
  const combinedTarget = target4Lines() + ckdTarget + se206Target + darpooshTarget + dieselTarget;
  const sum4 = rows.reduce((s,e)=>s+mainFourTotal(e),0);
  const sumAll = rows.reduce((s,e)=>s+allLinesTotal(e),0);
  const targetTotal = rows.reduce((s,e)=>s+dayTarget4Lines(e),0);
  const avgDevPct = targetTotal? (sum4-targetTotal)/targetTotal : 0;
  const totalShip = rows.reduce((s,e)=>s+shipTotal(e),0);
  const totalWaste = M.waste.reduce((s,x)=>s+(x.wasteCount||0),0);
  const totalProduced = (()=>{ const seen=new Set(); let s=0; M.waste.forEach(x=>{ const key=x.date+'|'+x.station+'|'+x.part; if(x.produced&&!seen.has(key)){s+=x.produced; seen.add(key);} }); return s; })();
  const wasteRate = totalProduced? totalWaste/totalProduced : 0;
  const totalStopHours = M.stop.reduce((s,x)=>s+(x.hours||0),0);
  const problemEvents = (()=>{ let n=0; M.daily.forEach(e=> n += (e.notes.problems||'').split('|').map(s=>s.trim()).filter(Boolean).length); return n; })();
  const negDays = rows.filter(e=>mainFourTotal(e)>0 && mainFourTotal(e)-dayTarget4Lines(e)<0).length;
  const shortDays = new Set(M.short.map(x=>x.date)).size;

  const stationParetoW = paretoFrom(M.waste, x=>x.station, x=>x.wasteCount).slice(0,6);
  const stationParetoS = paretoFrom(M.stop, x=>x.station, x=>x.hours).slice(0,6);
  const problemPareto = (()=>{
    const map = {};
    M.daily.forEach(e=> (e.notes.problems||'').split('|').map(s=>s.trim()).filter(Boolean).forEach(p=>{ map[p]=(map[p]||0)+1; }));
    return Object.entries(map).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value).slice(0,6);
  })();

  // ---- ۰) «امروز» — آخرین روز ثبت‌شده در ماه فعال (نه لزوماً تاریخ تقویمی امروز، چون این یک ابزار
  // محلی بدون اتصال زنده است؛ صادقانه به همین شکل به کاربر نشان داده می‌شود) ----
  const unitCost = DB.meta.unitCostRial || 0;
  const todayRow = rows.length ? rows[rows.length-1] : null;
  const prevRow = rows.length>1 ? rows[rows.length-2] : null;
  const todayProduction = todayRow ? allLinesTotal(todayRow) : null;
  const todayTarget = todayRow ? dayCombinedTarget(todayRow) : null;
  const todayAttainmentPct = (todayTarget) ? todayProduction/todayTarget : null;
  const prevProduction = prevRow ? allLinesTotal(prevRow) : null;
  const vsPrevPct = (prevRow && prevProduction) ? (todayProduction-prevProduction)/prevProduction : null;
  const todayStops = todayRow ? M.stop.filter(x=>x.date===todayRow.date) : [];
  const todayStopHours = todayStops.reduce((s,x)=>s+(x.hours||0),0);
  const todayWasteArr = todayRow ? M.waste.filter(x=>x.date===todayRow.date) : [];
  const todayWasteQty = todayWasteArr.reduce((s,x)=>s+(x.wasteCount||0),0);
  const todayShortArr = todayRow ? M.short.filter(x=>x.date===todayRow.date && x.status!=='تامین شده') : [];
  const todayStopLostQty = todayStops.reduce((s,x)=>s+(x.hours||0)*resolveStationRate(x.station),0);
  const todayLossValue = (todayStopLostQty + todayWasteQty) * unitCost;

  function suggestedAction(reason){
    const map = {
      'عدم تامین قطعه':'پیگیری فوری تامین قطعه با انبار/خرید', 'خرابی دستگاه':'فراخوان تعمیرات و بررسی نگهداری پیشگیرانه',

    datasets:[{ data: shipGroups.map(g=>rows.reduce((s,e)=>s+g.fields.reduce((s2,f)=>s2+(e.ship[f]||0),0),0)), backgroundColor: PALETTE, borderColor:'#101827', borderWidth:3 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{legend:{position:'bottom', labels:{boxWidth:10,padding:14}}} } });

  paretoChart('dChWaste', stationParetoW, '#ff5d6c');
  paretoChart('dChStop', stationParetoS, '#ff9d42');
  mkChart('dChProblems', { type:'bar', data:{ labels: problemPareto.map(x=>x.label), datasets:[{data: problemPareto.map(x=>x.value), backgroundColor:'#b389ff', borderRadius:8, maxBarThickness:30}]},
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{grid:{color:'#182338'}}, y:{grid:{display:false}, ticks:{font:{size:11}}}} } });

  bindMonthBar(()=>renderDash());
  document.getElementById('printBtn').addEventListener('click', ()=> window.print());
  document.getElementById('exportAllCsvBtn').addEventListener('click', ()=>{
    const headers = ['تاریخ','روز','خط1','خط2','خط3','خط4','جمع4خط','هدف','انحراف','جمع کل','جمع ارسال'];
    const rr = rows.map(e=>[e.date,e.day,e.lines.line1.qty,e.lines.line2.qty,e.lines.line3.qty,e.lines.line4.qty, mainFourTotal(e), dayTarget4Lines(e), mainFourTotal(e)-dayTarget4Lines(e), allLinesTotal(e), shipTotal(e)]);
    downloadFile('داشبورد-مدیریتی-تولید.csv', toCSV(headers, rr), 'text/csv;charset=utf-8');
  });
}

/* =========================================================================
   TAB: هدف و پیشرفت تولید (target) — هدف تولید ماهانه‌ای که واحد برنامه‌ریزی
   اعلام می‌کند را می‌گیرد، مسیر تجمعی/روزانه واقعی را در برابر آن ترسیم
   می‌کند، فاصله تا هدف و پیش‌بینی پایان ماه را حساب می‌کند و در صورت وجود
   انحراف منفی، علل آن را با اتکا به داده‌های توقفات/ضایعات/کسری قطعات
   همین ماه رتبه‌بندی و کمّی می‌کند (قاعده‌محور — بدون نیاز به اتصال اینترنت).
   ========================================================================= */
function renderTargetProgress(){
  const M = monthData();
  const rows = [...M.daily].sort((a,b)=>dateSortKey(a.date)-dateSortKey(b.date));

  const monthlyTarget = DB.meta.monthlyTarget || 0;
  const workingDays = DB.meta.workingDaysPerMonth || 23;
  const dailyTargetFlat = workingDays ? monthlyTarget/workingDays : 0; // مبنای «روز عادی» — روزهای تعطیل از این کوچک‌تر می‌شوند
  const dayTargets = rows.map(e=> dailyTargetFlat * dayShiftFactor(e));

  // تولید روزانه = جمع همه اقلام (۴ خط اصلی + CKD + سه‌راهی۲۰۶ + درپوش + دیزل/بنز)
  const dailyActual = rows.map(e=>allLinesTotal(e));
  let running = 0;
  const cumActual = dailyActual.map(v=>{ running += v; return running; });
  const cumTotal = cumActual.length ? cumActual[cumActual.length-1] : 0;
  let idealRunning = 0;
  const idealCum = dayTargets.map(v=>{ idealRunning += v; return idealRunning; });
  const idealSoFar = idealCum.length ? idealCum[idealCum.length-1] : 0;

  const remaining = Math.max(monthlyTarget - cumTotal, 0);
  const daysElapsed = rows.length;
  const daysRemaining = Math.max(workingDays - daysElapsed, 0);
  const progressPct = monthlyTarget ? cumTotal/monthlyTarget : null;
  const paceDevPct = idealSoFar ? (cumTotal-idealSoFar)/idealSoFar : null;
  const avgDailyActual = daysElapsed ? cumTotal/daysElapsed : 0;
  const requiredDailyRate = (daysRemaining>0 && remaining>0) ? remaining/daysRemaining : (remaining<=0 ? 0 : null);
  const forecastEnd = cumTotal + avgDailyActual*daysRemaining;
  const forecastVsTargetPct = monthlyTarget ? (forecastEnd-monthlyTarget)/monthlyTarget : null;
  const willHitTarget = monthlyTarget ? forecastEnd>=monthlyTarget : null;

  // ---- برآورد تولید ازدست‌رفته از هر علت توقف (تابع مشترک resolveStationRate/stopLossRanking) ----
  const stopRanked = stopLossRanking(M.stop);
  const totalStopLostQty = stopRanked.reduce((s,x)=>s+x.lostQty,0);
  const totalStopHours = M.stop.reduce((s,x)=>s+(x.hours||0),0);

  const wasteByStation = paretoFrom(M.waste, x=>x.station, x=>x.wasteCount).slice(0,6);
  const totalWasteQty = M.waste.reduce((s,x)=>s+(x.wasteCount||0),0);

  const pendingShort = M.short.filter(x=>x.status!=='تامین شده');
  const pendingShortParts = [...new Set(pendingShort.map(x=>x.part))];

  const gap = Math.max(idealSoFar - cumTotal, 0); // فاصله واقعی تا مسیر برنامه تا امروز
  const explainedByKnownCauses = totalStopLostQty + totalWasteQty;
  const explainedPct = gap ? Math.min(explainedByKnownCauses/gap, 1) : null;

  // ---- سه دلیل فنی برتر (کسری / ضایعات / توقفات) برای نمایش فشرده در باکس ----
  const topStop = stopRanked[0];
  const topWaste = wasteByStation[0];
  const reasonChip = (icon, label, headline, sub, color)=>`
    <div style="background:${color}14; border:1px solid ${color}3d; border-radius:12px; padding:10px 12px; display:flex; align-items:center; gap:10px; min-width:0;">
      <div style="width:32px; height:32px; border-radius:9px; background:${color}22; color:${color}; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;">${icon}</div>
      <div style="min-width:0; flex:1;">
        <div style="font-size:10px; color:#93a4c3; margin-bottom:1px;">${label}</div>
        <div style="font-weight:800; font-size:12.5px; color:${color}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${headline}</div>
        <div style="font-size:10px; color:#c9d4e8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${sub}</div>
      </div>
    </div>`;
  const reasonChipsHtml = `<div class="grid grid-3" style="gap:10px; margin-bottom:14px;">
    ${reasonChip('⏸','توقف غالب', topStop? esc(topStop.label) : 'ثبت نشده', topStop? fmt(topStop.hours,1)+' ساعت · ~'+fmt(topStop.lostQty,0)+' عدد' : '—', '#ff5d6c')}
    ${reasonChip('🗑','ضایعات غالب', topWaste? esc(topWaste.label) : 'ثبت نشده', topWaste? fmt(topWaste.value,0)+' عدد · '+pct(topWaste.pct,0)+' از کل' : '—', '#ffcf5c')}
    ${reasonChip('🧩','کسری قطعه', pendingShortParts.length? fmt(pendingShortParts.length,0)+' قطعه' : 'ندارد', pendingShortParts.length? esc(pendingShortParts.slice(0,2).join('، ')) : '—', '#4c8dff')}
  </div>`;

  // ---- تحلیل خودکار (قاعده‌محور) ----
  const insights = [];
  if(monthlyTarget<=0){
    insights.push({icon:'⚙️', color:'#93a4c3', text:'برای فعال‌سازی این تحلیل، ابتدا «هدف تولید ماهانه» را در کادر بالا وارد و ذخیره کنید (همان عددی که واحد برنامه‌ریزی تولید اعلام می‌کند، مثلاً 290000).'});
  } else if(rows.length===0){
    insights.push({icon:'⚙️', color:'#93a4c3', text:'برای این ماه هنوز روزی در «ورود داده روزانه» ثبت نشده — پس از اولین ثبت، این تحلیل کامل می‌شود.'});
  } else {
    if(paceDevPct!==null && paceDevPct < -0.02){
      insights.push({icon:'📉', color:'#ff5d6c', text:`تولید تجمعی تا امروز <b>${pct(paceDevPct,1)}</b> عقب‌تر از مسیر خطی هدف ماهانه است — معادل <b>${fmt(gap,0)} عدد</b> عقب‌ماندگی نسبت به برنامه.`});
    } else if(paceDevPct!==null && paceDevPct < 0.02){
      insights.push({icon:'🟡', color:'#ffcf5c', text:`تولید تجمعی تا امروز تقریباً هم‌راستا با مسیر هدف ماهانه است (انحراف <b>${pct(paceDevPct,1)}</b>).`});
    } else if(paceDevPct!==null){
      insights.push({icon:'✅', color:'#2fd9c4', text:`تولید تجمعی تا امروز <b>${pct(paceDevPct,1)}</b> جلوتر از مسیر خطی هدف ماهانه است.`});
    }
    if(!stopRanked[0] && totalStopHours>0){
      insights.push({icon:'⏸', color:'#ff9d42', text:`جمعاً <b>${fmt(totalStopHours,1)} ساعت</b> توقف در تب «توقفات تولید» ثبت شده؛ برای برآورد دقیق‌تر عدد ازدست‌رفته، نام ایستگاه توقف را دقیقاً مطابق نام ایستگاه‌های ثبت‌شده در «تنظیمات واحد» وارد کنید.`});
    }
    if(gap>0 && explainedPct!==null){
      insights.push({icon:'🧭', color:'#b389ff', text:`حدود <b>${pct(explainedPct,0)}</b> از فاصله فعلی تا مسیر هدف، با توقفات و ضایعات ثبت‌شده قابل توضیح است؛ باقیمانده احتمالاً ناشی از سرعت پایین‌تر خطوط نسبت به استاندارد، کمبود نیرو یا روزهای بدون ثبت است.`});
    }
    if(willHitTarget!==null){
      insights.push({icon: willHitTarget?'🎯':'🚨', color: willHitTarget?'#2fd9c4':'#ff5d6c',
        text: willHitTarget
          ? `با ادامه روند فعلی (میانگین <b>${fmt(avgDailyActual,0)}</b> عدد در روز)، پیش‌بینی پایان ماه <b>${fmt(forecastEnd,0)}</b> عدد است — <b>${pct(Math.abs(forecastVsTargetPct),1)}</b> بالاتر از هدف.`
          : `با ادامه روند فعلی، پیش‌بینی پایان ماه <b>${fmt(forecastEnd,0)}</b> عدد است — <b>${pct(Math.abs(forecastVsTargetPct),1)}</b> کمتر از هدف؛ برای جبران، نرخ روزانه باید به <b>${requiredDailyRate===null?'—':fmt(requiredDailyRate,0)}</b> عدد در روزهای باقیمانده برسد (فعلاً میانگین <b>${fmt(avgDailyActual,0)}</b>).`
      });
    }
  }

  document.getElementById('view').innerHTML = renderMonthBar() + `
  <div class="card" style="margin-bottom:16px;">
    <div class="flexbar">
      <h3 style="margin:0;">🎯 هدف تولید ماهانه</h3>
      <span class="hint" style="margin:0;">همان «هدف تولید ماهانه» تب شاخص‌های ناب — از هرکدام تغییر دهید، همه‌جا به‌روز می‌شود.</span>
    </div>
    <div class="form-grid" style="margin-top:10px;">
      <div class="field"><label>هدف تولید ماهانه (عدد کل — همه اقلام)</label><input id="tp_target" type="text" inputmode="numeric" value="${monthlyTarget||''}" placeholder="مثلاً 290000"></div>
      <div class="field"><label>روزهای کاری این ماه</label><input id="tp_workdays" type="text" inputmode="numeric" value="${workingDays}"></div>
    </div>
    <button class="btn btn-teal btn-sm" id="tp_saveBtn" style="margin-top:12px;">ذخیره هدف</button>
  </div>

  <div class="grid grid-4" style="margin-bottom:16px;">
    ${kpiCard('هدف ماهانه','عدد', monthlyTarget? fmt(monthlyTarget,0):'—', null, '#4c8dff')}
    ${kpiCard('تولید تجمعی تا امروز','عدد', fmt(cumTotal,0), null, '#ff9d42')}
    ${kpiCard('باقیمانده تا هدف','عدد', monthlyTarget? fmt(remaining,0):'—', null, remaining>0?'#ffcf5c':'#2fd9c4')}
    ${kpiCard('درصد پیشرفت از هدف','', progressPct===null?'—':pct(progressPct,1), null, (progressPct!==null&&progressPct>=1)?'#2fd9c4':'#4c8dff')}
  </div>
  <div class="grid grid-4" style="margin-bottom:16px;">
    ${kpiCard('انحراف از مسیر برنامه تا امروز','', paceDevPct===null?'—':pct(paceDevPct,1), null, paceDevPct===null?'#93a4c3':paceDevPct>=0?'#2fd9c4':'#ff5d6c')}
    ${kpiCard('روزهای سپری‌شده / باقیمانده','روز', `${fmt(daysElapsed,0)} / ${fmt(daysRemaining,0)}`, null, '#b389ff', true)}
    ${kpiCard('نرخ روزانه لازم برای جبران','عدد/روز', requiredDailyRate===null?'—':fmt(requiredDailyRate,0), null, '#ff5d6c')}
    ${kpiCard('پیش‌بینی تحقق هدف در پایان ماه','عدد', monthlyTarget? fmt(forecastEnd,0):'—', null, willHitTarget===false?'#ff5d6c':'#2fd9c4')}
  </div>

  <div class="card" style="margin-bottom:16px;">
    <div class="flexbar"><h3 style="margin:0;">میزان پیشرفت تا هدف ماهانه</h3><span class="hint" style="margin:0;">${monthlyTarget? fmt(cumTotal,0)+' از '+fmt(monthlyTarget,0):'هدف تعیین نشده'}</span></div>
    <div style="background:#0e1626; border:1px solid var(--panel-border); border-radius:10px; height:26px; overflow:hidden; margin-top:10px; position:relative;">
      <div style="height:100%; border-radius:10px; transition:width .4s; width:${monthlyTarget? Math.min(100,Math.max(0,(progressPct||0)*100)) : 0}%; background:linear-gradient(90deg, #4c8dff, ${progressPct!==null && progressPct>=1?'#2fd9c4':'#ff9d42'});"></div>
      ${monthlyTarget>0 && idealSoFar>0 ? `<div style="position:absolute; top:0; bottom:0; left:${Math.min(100,Math.max(0,(idealSoFar/monthlyTarget)*100))}%; width:2px; background:#eef2f9;"></div>` : ''}
    </div>
    <div class="hint" style="margin-top:8px;">خط سفید عمودی = جایی که طبق مسیر خطی هدف، باید امروز می‌بودیم (${fmt(idealSoFar,0)} عدد).</div>
  </div>

  <div class="card" style="margin-bottom:16px;">
    <h3>روند روزانه تولید در برابر هدف و مسیر تجمعی</h3>
    <div class="chart-box" style="height:340px;"><canvas id="chTargetCombo"></canvas></div>
  </div>

  <div class="card" style="margin-bottom:16px;">
    <h3>انحراف روزانه از هدف همان روز <span class="muted">(روزهای تعطیل با هدف کوچک‌تر مقایسه می‌شوند)</span></h3>
    <div class="chart-box"><canvas id="chTargetDev"></canvas></div>
  </div>

  <div class="card" style="margin-bottom:16px;">
    <div class="flexbar">
      <h3 style="margin:0;">🧠 تحلیل هوشمند انحراف تولید</h3>
      <button class="btn btn-ghost btn-sm" id="tp_aiBtn" type="button">آماده‌سازی خلاصه برای تحلیل با هوش مصنوعی</button>
    </div>
    ${monthlyTarget>0 && rows.length>0 ? reasonChipsHtml : ''}
    ${insights.length===0? `<div class="tbl-empty">داده کافی برای تحلیل موجود نیست.</div>` :
      insights.map(x=>`<div class="insight"><div class="ico" style="background:${x.color}22; color:${x.color};">${x.icon}</div><p>${x.text}</p></div>`).join('')}
    <div class="hint" style="margin-top:10px; line-height:1.9;">
      این تحلیل قاعده‌محور است — از داده‌های واقعی همین ماه در تب‌های «توقفات تولید»، «ضایعات تولید» و «کسری قطعات» ساخته می‌شود و نیازی به اتصال اینترنت ندارد. دکمه بالا یک خلاصه ساخت‌یافته از وضعیت این ماه می‌سازد که می‌توانید در ChatGPT/Claude یا هر دستیار هوش مصنوعی دیگری جای‌گذاری کنید تا یک تحلیل روایی عمیق‌تر و پیشنهاد اقدام دریافت کنید.
    </div>
  </div>

  ${stopRanked.length? `
  <div class="card" style="margin-bottom:16px;">
    <h3>سهم علل توقف از تولید ازدست‌رفته (برآوردی، عدد) <span class="muted">— روی هر میله کلیک کنید تا جزئیاتش را ببینید</span></h3>
    <div class="chart-box sm"><canvas id="chTargetStopLoss"></canvas></div>
  </div>` : ''}

  <div class="card">
    <h3>📐 روش محاسبه</h3>
    <div class="hint" style="line-height:2.1;">
      • <b>تولید روزانه</b> = جمع همه اقلام ثبت‌شده در «ورود داده روزانه» (۴ خط اصلی + CKD + سه‌راهی۲۰۶ + درپوش + دیزل/بنز).<br>
      • <b>هدف روزانه</b> = (هدف تولید ماهانه ÷ روزهای کاری ماه) × نسبت ساعت شیفت آن روز به روز عادی — یعنی روزی که در «ورود داده روزانه» به‌عنوان «تعطیل» علامت زده باشید (مثلاً ۸ از ۱۰ ساعت)، هدف آن روز خودکار ۸۰٪ می‌شود؛ این روزها با نشانه 🌙 روی نمودارها مشخص شده‌اند.<br>
      • <b>مسیر تجمعی هدف</b> = مجموع هدف روزانه (تعدیل‌شده با ساعت شیفت) تا امروز، نه یک خط مستقیم ساده.<br>
      • <b>پیش‌بینی پایان ماه</b> = تولید تجمعی تا امروز + (میانگین تولید روزانه فعلی × روزهای کاری باقیمانده).<br>
      • <b>تولید ازدست‌رفته از توقف</b> (برآوردی) = ساعت توقف هر رویداد × نرخ استاندارد ساعتی ایستگاه مربوطه (از «تنظیمات واحد» → ایستگاه‌ها). چون نام ایستگاه در ثبت توقف آزادانه تایپ می‌شود، تطبیق هم به‌صورت دقیق و هم فازی (نادیده‌گرفتن فاصله/اعداد/علائم) انجام می‌شود؛ اگر باز هم هیچ ایستگاهی تطبیق نخورد، از میانگین نرخ کل ایستگاه‌ها به‌عنوان برآورد استفاده می‌شود (نه صفر) تا هیچ توقفی از این تحلیل حذف نشود.<br>
      برای تکمیل این تحلیل، «هدف تولید ماهانه» و «روزهای کاری ماه» را در کادر بالای همین صفحه، و «ساعت شیفت روز عادی» را در تب «گزارش تولید خط تولید» ذخیره کنید.
    </div>
  </div>`;

  bindMonthBar(()=>renderTargetProgress());

  document.getElementById('tp_saveBtn').addEventListener('click', ()=>{
    const mt = num(document.getElementById('tp_target').value);
    const wd = num(document.getElementById('tp_workdays').value);
    DB.meta.monthlyTarget = mt===null? 0 : Math.max(0, mt);
    DB.meta.workingDaysPerMonth = (wd===null||wd<=0)? 23 : wd;
    scheduleSave(); toast('هدف تولید ماهانه ذخیره شد.','ok'); renderTargetProgress();
  });

  document.getElementById('tp_aiBtn').addEventListener('click', ()=> openAiSummaryModal({
    monthlyTarget, workingDays, cumTotal, remaining, daysElapsed, daysRemaining, progressPct, paceDevPct,
    avgDailyActual, requiredDailyRate, forecastEnd, forecastVsTargetPct, stopRanked, wasteByStation, totalWasteQty,
    pendingShortParts
  }));

  const devArr = dailyActual.map((v,i)=> v - dayTargets[i]);
  const devPctArr = devArr.map((v,i)=> dayTargets[i] ? v/dayTargets[i] : null);
  const xLabels = rows.map((e)=> e.date + (dayShiftFactor(e)<1 ? ' 🌙' : ''));

  mkChart('chTargetCombo', {
    data:{ labels: xLabels,
      datasets:[
        { type:'bar', label:'تولید روزانه واقعی', data: dailyActual, backgroundColor:'#4c8dff', borderRadius:5, maxBarThickness:26, yAxisID:'y', order:3 },
        { type:'line', label:'هدف روزانه', data: dayTargets, borderColor:'#7c8aa5', borderDash:[5,4], pointRadius:0, tension:0, yAxisID:'y', order:2, noLabel:true },
        { type:'line', label:'تولید تجمعی', data: cumActual, borderColor:'#ff9d42', backgroundColor:'rgba(255,157,66,.12)', fill:true, tension:.3, pointRadius:2, yAxisID:'y1', order:1 },
        { type:'line', label:'مسیر تجمعی هدف', data: idealCum, borderColor:'#2fd9c4', borderDash:[6,4], pointRadius:0, tension:0, yAxisID:'y1', order:1, noLabel:true },
      ]},
    options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
      plugins:{legend:{position:'bottom', labels:{boxWidth:10,padding:14}}},
      scales:{
        x:{grid:{display:false}},
        y:{ position:'right', grid:{color:'#182338'}, title:{display:true, text:'روزانه', color:'#7c8aa5', font:{size:10}} },
        y1:{ position:'left', grid:{display:false}, title:{display:true, text:'تجمعی', color:'#7c8aa5', font:{size:10}} },
      }
    },
    plugins: monthlyTarget>0 ? [{
      id:'monthlyTargetLine',
      afterDraw(chart){
        const yScale = chart.scales.y1, area = chart.chartArea, ctx = chart.ctx;
        if(!yScale || monthlyTarget > yScale.max*1.3) return;
        const y = yScale.getPixelForValue(monthlyTarget);
        ctx.save(); ctx.strokeStyle = '#ff5d6c'; ctx.setLineDash([5,4]); ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(area.left, y); ctx.lineTo(area.right, y); ctx.stroke();
        ctx.setLineDash([]); ctx.fillStyle = '#ff5d6c'; ctx.font = '10.5px Vazirmatn'; ctx.textAlign = 'left';
        ctx.fillText('هدف نهایی '+fmt(monthlyTarget,0), area.left+4, Math.max(area.top+11, y-6));
        ctx.restore();
      }
    }] : []
  });

  mkChart('chTargetDev', { type:'bar', data:{ labels: xLabels,
    datasets:[{ label:'انحراف از هدف روزانه', data: devArr,
      backgroundColor: devArr.map(v=> v>=0?'#2fd9c4':'#ff5d6c'), borderRadius:5, maxBarThickness:26, noLabel:true }]},
    options:{ responsive:true, maintainAspectRatio:false,
      layout:{ padding:{ top:28, bottom:28 } },
      plugins:{ legend:{display:false},
        tooltip:{ callbacks:{ label:(c)=>{ const v=c.parsed.y; const p=devPctArr[c.dataIndex]; return 'انحراف: '+fmt(v,0)+' عدد'+(p===null?'':' ('+pct(p,1)+')'); } } } },
      scales:{ x:{grid:{display:false}}, y:{grid:{color:'#182338'}} } },
    plugins:[{
      // چیپ شناور درصد انحراف روی هر میله — واضح، بدون همپوشانی با محور یا عدد میله
      id:'devPctFloater',
      afterDatasetsDraw(chart){
        const meta = chart.getDatasetMeta(0);
        if(!meta || !meta.data || !meta.data.length) return;
        const ctx = chart.ctx, area = chart.chartArea;
        ctx.save();
        ctx.font = '700 10px Vazirmatn'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        meta.data.forEach((bar,i)=>{
          const p = devPctArr[i];
          if(p===null || p===undefined || isNaN(p)) return;
          const label = pct(p,0);
          const isPos = devArr[i] >= 0;
          const color = isPos ? '#2fd9c4' : '#ff5d6c';
          const tw = ctx.measureText(label).width;
          const padX = 5, h = 15, w = tw + padX*2, r = h/2;
          const cx = bar.x;
          let cy = isPos ? bar.y - 13 : bar.y + 13;
          cy = Math.max(area.top + r + 1, Math.min(area.bottom - r - 1, cy));
          const rx = cx - w/2, ry = cy - h/2;
          ctx.beginPath();
          ctx.moveTo(rx+r, ry);
          ctx.arcTo(rx+w, ry, rx+w, ry+h, r);
          ctx.arcTo(rx+w, ry+h, rx, ry+h, r);
          ctx.arcTo(rx, ry+h, rx, ry, r);
          ctx.arcTo(rx, ry, rx+w, ry, r);
          ctx.closePath();
          ctx.fillStyle = 'rgba(14,22,38,.94)';
          ctx.fill();
          ctx.strokeStyle = color; ctx.lineWidth = 1.1; ctx.stroke();
          ctx.fillStyle = color;
          ctx.fillText(label, cx, cy+0.5);
        });
        ctx.restore();
      }
    }]
  });

  if(stopRanked.length){
    const top = stopRanked.slice(0,6);
    mkChart('chTargetStopLoss', { type:'bar', data:{ labels: top.map(x=>x.label),
      datasets:[{ data: top.map(x=>Math.round(x.lostQty)), backgroundColor:'#ff5d6c', borderRadius:6, maxBarThickness:30 }]},
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
        onClick:(evt, elements)=>{ if(elements && elements.length) openStopReasonDrilldown(top[elements[0].index].label, M.stop); },
        onHover:(evt, elements)=>{ if(evt.native && evt.native.target) evt.native.target.style.cursor = elements.length? 'pointer' : 'default'; },
        scales:{ x:{grid:{color:'#182338'}}, y:{grid:{display:false}, ticks:{font:{size:11}}} } } });
  }
}

/* خلاصه ساخت‌یافته قابل‌کپی برای جای‌گذاری در یک دستیار هوش مصنوعی خارجی
   (ChatGPT/Claude/...) — این ابزار خودش به هیچ سرویس هوش مصنوعی متصل نیست،
   فقط داده‌های همین ماه را به‌صورت خلاصه و منظم آماده می‌کند. */
// جزئیات رویدادهای تشکیل‌دهنده یک «علت توقف» — با کلیک روی میله نمودار «سهم علل توقف» باز می‌شود
function openStopReasonDrilldown(reason, stopArr){
  const items = stopArr.filter(x=>(x.reason||'سایر')===reason).sort((a,b)=>dateSortKey(b.date)-dateSortKey(a.date));
  let totalLost = 0;
  const totalHours = items.reduce((s,x)=>s+(x.hours||0),0);
  const rowsHtml = items.map(x=>{
    const rate = resolveStationRate(x.station);
    const lost = (x.hours||0)*rate;
    totalLost += lost;
    return `<tr>
      <td>${esc(x.date)}</td>
      <td>${esc(x.station)}</td>
      <td class="num">${fmt(x.hours,1)}</td>
      <td class="num"><b style="color:#ff5d6c;">${fmt(lost,0)}</b></td>
      <td>${x.planned?'<span class="tag" style="background:#173a2e;color:#8ff0c8;padding:2px 8px;border-radius:10px;font-size:10px;">🗓 برنامه‌ریزی‌شده</span>':'<span class="tag" style="background:#3a1f22;color:#ff8d95;padding:2px 8px;border-radius:10px;font-size:10px;">⚡ اضطراری</span>'}</td>
      <td>${esc(x.description)||'—'}</td>
    </tr>`;
  }).join('');
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-bg" id="drillbg"><div class="modal" style="max-width:780px;">
    <h3>⏸ جزئیات توقف‌های علت «${esc(reason)}»</h3>
    <p class="desc">جمع <b>${fmt(items.length,0)} رویداد</b> در این ماه، معادل <b>${fmt(totalHours,1)} ساعت</b> توقف — برآورد کل تولید ازدست‌رفته: <b style="color:#ff5d6c;">${fmt(totalLost,0)} عدد</b> (ساعت هر رویداد × نرخ استاندارد ساعتی ایستگاه مربوطه؛ برای ایستگاه‌های بدون تطبیق دقیق در «تنظیمات واحد»، میانگین نرخ کل ایستگاه‌ها استفاده شده است).</p>
    <div class="table-wrap" style="max-height:420px; overflow:auto;">
      <table>
        <thead><tr><th>تاریخ</th><th>ایستگاه</th><th class="num">ساعت</th><th class="num">برآورد ازدست‌رفته</th><th>نوع</th><th>توضیحات</th></tr></thead>
        <tbody>${rowsHtml || '<tr><td colspan="6"><div class="tbl-empty">موردی یافت نشد.</div></td></tr>'}</tbody>
      </table>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="drill_close">بستن</button>
    </div>
  </div></div>`;
  document.getElementById('drillbg').addEventListener('click', e=>{ if(e.target.id==='drillbg') root.innerHTML=''; });
  document.getElementById('drill_close').addEventListener('click', ()=> root.innerHTML='');
}

    <textarea id="aiSummaryText" style="width:100%; min-height:260px; background:#0e1626; border:1px solid var(--panel-border); border-radius:10px; color:var(--text); padding:12px; font-family:inherit; font-size:12.5px; line-height:1.9;" readonly>${esc(text)}</textarea>
    <div class="modal-actions">

// اگر مقدار فعلی رکورد در این فهرست نبود، همان مقدار به‌عنوان گزینه اضافه نگه داشته می‌شود.
function partSelectHtml(id, currentVal){

// تاریخ کشویی یک‌فیلدی — یک select با مقدار کامل «۱۴۰۵/۰۵/۲۰»؛ برای انتخاب راحت، روزهای سه ماه
// (ماه قبل، ماه فعال، ماه بعد) به‌صورت گروه‌بندی‌شده لیست می‌شود. اگر مقدار فعلی رکورد
// (مثلاً هنگام ویرایش یک رکورد قدیمی‌تر) خارج از این بازه بود، همان مقدار هم به‌عنوان گزینه اضافه می‌شود.
function shiftJalaliMonth_(y, m, delta){
  let mm = m + delta, yy = y;
  while(mm < 1){ mm += 12; yy--; }
  while(mm > 12){ mm -= 12; yy++; }
  return [yy, mm];
}
function datePickerHtml(idPrefix, currentDateStr){
  const cur = normDate(currentDateStr||'');
  const activeParts = (DB.meta.activeMonth||'').split('/');
  const curParts = cur.split('/');
  const y = parseInt(curParts[0] || activeParts[0] || '1405', 10);
  const m = curParts[1] ? parseInt(curParts[1],10) : (parseInt(activeParts[1],10) || 1);
  const months = [shiftJalaliMonth_(y,m,-1), [y,m], shiftJalaliMonth_(y,m,1)];
  const days = Array.from({length:31}, (_,i)=>i+1);
  let optHtml = '<option value="">— انتخاب —</option>';
  months.forEach(([yy,mm])=>{
    optHtml += `<optgroup label="${FA_MONTH_NAMES[mm]} ${yy}">`;
    days.forEach(d=>{
      const val = yy + '/' + String(mm).padStart(2,'0') + '/' + String(d).padStart(2,'0');
      optHtml += `<option value="${val}" ${cur===val?'selected':''}>${val}</option>`;
    });
    optHtml += '</optgroup>';
  });
  const inWindow = months.some(([yy,mm]) => cur.startsWith(yy+'/'+String(mm).padStart(2,'0')+'/'));
  if(cur && !inWindow) optHtml += `<option value="${cur}" selected>${cur}</option>`;
  return `<select id="${idPrefix}">${optHtml}</select>`;
}
function readDatePicker(idPrefix){
  const el = document.getElementById(idPrefix);
  return el ? normDate(el.value) : '';
}
// ساعت کشویی (ساعت/دقیقه، گام ۱۵ دقیقه‌ای) — به‌جای تایپ دستی؛ اختیاری (می‌تواند خالی بماند)
// اختلاف زمانی بین دو ساعت «HH:MM» به ساعت اعشاری (اگر پایان از شروع کوچک‌تر بود یعنی از نیمه‌شب رد شده)
function hoursBetweenTimes(startStr, endStr){
  if(!startStr || !endStr) return null;
  const sp = startStr.split(':').map(Number), ep = endStr.split(':').map(Number);
  if(sp.length<2 || ep.length<2 || isNaN(sp[0]) || isNaN(ep[0])) return null;
  let mins = (ep[0]*60+ep[1]) - (sp[0]*60+sp[1]);
  if(mins < 0) mins += 24*60;
  return mins/60;
}
// هدف واقعی یک ثبت ساعتی ایستگاه — اگر بازه ساعت شروع/پایان مشخص شده باشد، هدف متناسب با همان چند ساعت
// محاسبه می‌شود (استاندارد ساعتی × ساعت کارکرد)، نه همیشه هدف کامل روزانه. اگر بازه خالی بود، محافظه‌کارانه
// هدف کامل روزانه در نظر گرفته می‌شود (رفتار قبلی، برای رکوردهایی که ساعت کاری وارد نشده).
function proratedStationTarget(st, hoursWorked){
  if(!st) return 0;
  if(hoursWorked!==null && hoursWorked!==undefined && hoursWorked>0 && st.hourlyStandard>0){
    return Math.round(st.hourlyStandard * hoursWorked);
  }
  return st.dailyTarget||0;
}
function timePickerHtml(idPrefix, currentTimeStr){
  const parts = String(currentTimeStr||'').split(':');
  const curH = (parts[0]!==undefined && parts[0]!=='') ? parseInt(parts[0],10) : null;
  const curMin = (parts[1]!==undefined && parts[1]!=='') ? parseInt(parts[1],10) : null;
  const hours = Array.from({length:24},(_,i)=>i);
  const mins = [0,15,30,45];
  return `<div id="${idPrefix}" style="display:flex; gap:6px; align-items:center;">

    <span style="color:#93a4c3;">:</span>
    <select id="${idPrefix}_m" style="flex:1;"><option value="">—</option>${mins.map(m=>`<option value="${m}" ${curMin===m?'selected':''}>${String(m).padStart(2,'0')}</option>`).join('')}</select>

}
function readTimePicker(idPrefix){

function kpiCard(label, unit, val, deltaDir, color, small){

// چیپ هشدار زودهنگام ریسک — نیمه اول بازه را با نیمه دوم مقایسه می‌کند تا روند صعودی/نزولی
// (توقف، ضایعات، کسری و ...) پیش از تبدیل‌شدن به بحران آخر ماه، قابل مشاهده باشد.
function riskChip(label, trend, unit, subtitle){
  if(!trend) return `<div style="background:#93a4c314; border:1px solid #93a4c33d; border-radius:12px; padding:12px 14px;">
    <div style="font-size:11px; color:#93a4c3;">${label}</div>
    <div style="font-weight:800; font-size:13.5px; color:#93a4c3; margin-top:4px;">داده کافی نیست</div>
  </div>`;
  const d = trend.deltaPct;
  let level, color, icon;
  if(d===null){ level='نامشخص'; color='#93a4c3'; icon='⚪'; }
  else if(d>0.15){ level='ریسک بالا — رو به افزایش'; color='#ff5d6c'; icon='🔴'; }
  else if(d<-0.15){ level='رو به بهبود'; color='#2fd9c4'; icon='🟢'; }
  else { level='باثبات'; color='#ffcf5c'; icon='🟡'; }
  return `<div style="background:${color}14; border:1px solid ${color}3d; border-radius:12px; padding:12px 14px;">

/* ---------------------------- send-to-management (SMS / WhatsApp) ---------------------------- */
function normPhoneIntl(p){
  p = toEnDigits(p||'').replace(/[^\d+]/g,'');
  if(!p) return '';
  if(p.startsWith('00')) p = '+' + p.slice(2);
  if(p.startsWith('0')) p = '+98' + p.slice(1);
  if(!p.startsWith('+')) p = '+' + p;
  return p;
}
function currentLineName(){ return (LINES.find(l=>l.id===currentLineId)||{}).name || DB.meta.unitName || 'خط تولید'; }
function buildShortMessage(rec){
  return `📋 کسری قطعه — ${currentLineName()}\nتاریخ: ${rec.date}\nقطعه/شرح: ${rec.part}\nوضعیت: ${rec.status}${rec.description?('\nتوضیحات: '+rec.description):''}\n— ارسالی از سامانه پارس نیکان`;
}
function buildStopMessage(rec){
  return `⏸ توقف خط تولید — ${currentLineName()}\nتاریخ: ${rec.date}\nایستگاه: ${rec.station}\nمدت: ${fmt(rec.hours,1)} ساعت\nعلت: ${rec.reason}${rec.description?('\nتوضیحات: '+rec.description):''}\n— ارسالی از سامانه پارس نیکان`;
}
function smsHref(phone, text){
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const sep = isIOS ? '&' : '?';
  return 'sms:' + phone + sep + 'body=' + encodeURIComponent(text);
}
function waHref(phone, text){ return 'https://wa.me/' + phone.replace('+','') + '?text=' + encodeURIComponent(text); }
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast('متن پیام کپی شد.','ok')).catch(()=>legacyCopy(text));
  } else legacyCopy(text);
}
function legacyCopy(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    toast('متن پیام کپی شد.','ok');
  }catch(e){ toast('کپی خودکار پشتیبانی نشد — متن را دستی انتخاب و کپی کنید.','err'); }
}
function sendSmsViaKavenegar(phone, text){
  if(!GSHEET.url) return Promise.resolve({ok:false, error:'no-gsheet'});
  return fetch(GSHEET.url, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ token: GSHEET.token, action:'sendSms', phone, message: text })
  }).then(r=>r.json()).catch(e=>({ok:false, error:String(e)}));
}
function promptSendToManagement(rec, kind){
  // kind: 'short' | 'stop'
  const phone = normPhoneIntl(ORG.managerPhone);
  if(!phone){ toast('ابتدا شماره موبایل مدیریت ارشد را در تنظیمات وارد کنید.','err'); openSettings(); return; }
  const text = kind==='short' ? buildShortMessage(rec) : buildStopMessage(rec);
  const root = document.getElementById('modalRoot');
  const titleTxt = kind==='short' ? 'ارسال کسری به مدیریت ارشد؟' : 'ارسال توقف به مدیریت ارشد؟';
  const canAutoSms = !!GSHEET.url; // ارسال خودکار فقط وقتی به گوگل‌شیت (و از آنجا به کاوه‌نگار) وصل باشیم ممکن است
  root.innerHTML = `<div class="modal-bg" id="smbg"><div class="modal">
    <h3>📤 ${titleTxt}</h3>
    <div class="hint" style="margin-bottom:10px;">شماره مقصد: <b style="color:var(--text); direction:ltr; display:inline-block;">${esc(phone)}</b></div>
    <p class="desc" style="white-space:pre-line;">${esc(text)}</p>
    ${canAutoSms ? `<div class="hint" style="margin-bottom:10px;">با «ارسال خودکار پیامک» پیام مستقیماً از سرور (کاوه‌نگار) فرستاده می‌شود — نیازی به باز شدن اپ گوشی شما نیست.</div>` : ''}
    <div class="hint" style="margin-bottom:14px;">با تپ روی گزینه‌های دیگر، اپ پیامک یا واتساپ گوشی <b>شما</b> با متن آماده باز می‌شود؛ کافیست دکمه‌ی ارسال را در همان اپ بزنید. اگر با تپ هیچ اپی باز نشد، از دکمه «کپی متن پیام» استفاده کنید.</div>
    <div class="modal-actions" style="flex-wrap:wrap;">
      <button class="btn btn-ghost" id="sm_cancel">فعلاً نه</button>
      <button class="btn btn-ghost" id="sm_copy">کپی متن پیام</button>
      <a class="btn btn-ghost" id="sm_wa" href="${waHref(phone, text)}" target="_blank" rel="noopener" style="border-color:rgba(56,161,105,.5); color:#68d391;">ارسال با واتساپ</a>
      <a class="btn btn-ghost" id="sm_sms" href="${smsHref(phone, text)}">ارسال با پیامک گوشی</a>
      ${canAutoSms ? `<button class="btn btn-primary" id="sm_auto">📡 ارسال خودکار پیامک (کاوه‌نگار)</button>` : ''}
    </div>
  </div></div>`;
  document.getElementById('smbg').addEventListener('click', e=>{ if(e.target.id==='smbg') root.innerHTML=''; });
  document.getElementById('sm_cancel').addEventListener('click', ()=> root.innerHTML='');
  document.getElementById('sm_copy').addEventListener('click', ()=> copyText(text));
  document.getElementById('sm_wa').addEventListener('click', ()=> setTimeout(()=>{ root.innerHTML=''; }, 200));
  document.getElementById('sm_sms').addEventListener('click', ()=> setTimeout(()=>{ root.innerHTML=''; }, 200));
  const autoBtn = document.getElementById('sm_auto');
  if(autoBtn) autoBtn.addEventListener('click', async ()=>{
    autoBtn.disabled = true; autoBtn.textContent = 'در حال ارسال…';
    const res = await sendSmsViaKavenegar(phone, text);
    if(res && res.ok){ toast('پیامک با موفقیت ارسال شد.','ok'); root.innerHTML=''; }
    else { toast('ارسال خودکار ناموفق بود — از گزینه‌های دیگر استفاده کنید.','err'); autoBtn.disabled=false; autoBtn.textContent='📡 ارسال خودکار پیامک (کاوه‌نگار)'; console.warn('Kavenegar send failed:', res); }
  });
}

/* ---------------------------- recycle bin (restore deleted rows) ---------------------------- */
const TRASH_LABELS = { daily:'ورود داده روزانه', waste:'ضایعات تولید', stop:'توقفات تولید', short:'کسری قطعات', stationHourly:'آمار ایستگاه' };
const TRASH_CAP = 300; // keep at most this many trashed items per line
function moveToTrash(type, record){
  if(!DB.trash) DB.trash = [];
  DB.trash.unshift({ id: uid(), type, data: record, deletedAt: new Date().toISOString() });
  if(DB.trash.length > TRASH_CAP) DB.trash.length = TRASH_CAP;
}
function trashSummary(item){
  const d = item.data;
  if(item.type==='daily') return `${d.date} — ${d.day||''} (جمع ۴خط: ${fmt(mainFourTotal(d),0)})`;
  if(item.type==='waste') return `${d.date} — ${d.station||''} / ${d.wasteType||''} (${fmt(d.wasteCount,0)} عدد)`;
  if(item.type==='stop') return `${d.date} — ${d.station||''} (${fmt(d.hours,1)} ساعت، ${d.reason||''})`;
  if(item.type==='short') return `${d.date} — ${d.part||''}`;
  if(item.type==='stationHourly') return `${d.date} — ${(stationById(d.stationId)||{}).name||''} (جمع: ${fmt(d.total,0)})`;
  return d.date || '';
}
function restoreFromTrash(trashId){
  const idx = DB.trash.findIndex(t=>t.id===trashId);
  if(idx===-1) return;
  const item = DB.trash[idx];
  const data = item.type==='daily' ? normalizeDailyArray([item.data])[0] : item.data;
  DB[item.type].push(data);
  DB.trash.splice(idx,1);
  scheduleSave();
  updateTrashBadge();
  toast('رکورد با موفقیت بازیابی شد.','ok');
  renderRecycleBin();
  goTo(currentTab);
}
function purgeFromTrash(trashId){
  DB.trash = DB.trash.filter(t=>t.id!==trashId);
  scheduleSave();
  updateTrashBadge();
  renderRecycleBin();
}
function openRecycleBin(){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-bg" id="rbbg"><div class="modal" style="max-width:600px;">
    <h3>🗑️ سطل بازیابی — ${esc(DB.meta.unitName||'')}</h3>
    <p class="desc">هر ردیفی که از تب‌های «ورود داده»، «ضایعات تولید»، «توقفات تولید» یا «کسری قطعات» حذف کنید، اینجا نگه داشته می‌شود تا هر وقت خواستید برش گردانید.</p>
    <div id="rbList" style="max-height:50vh; overflow:auto; display:flex; flex-direction:column; gap:8px; margin-bottom:14px;"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="rb_close">بستن</button>
      <button class="btn btn-danger" id="rb_empty">خالی کردن کامل سطل</button>
    </div>
  </div></div>`;
  document.getElementById('rbbg').addEventListener('click', e=>{ if(e.target.id==='rbbg') root.innerHTML=''; });
  document.getElementById('rb_close').addEventListener('click', ()=> root.innerHTML='');
  document.getElementById('rb_empty').addEventListener('click', ()=>{
    if(!DB.trash.length){ toast('سطل بازیابی خالی است.','ok'); return; }
    confirmDeleteModal('خالی کردن سطل بازیابی', 'همه‌ی ' + DB.trash.length + ' ردیف داخل سطل بازیابی برای همیشه حذف می‌شود. این عمل قابل بازگشت نیست.', ()=>{
      DB.trash = []; scheduleSave(); updateTrashBadge(); toast('سطل بازیابی خالی شد.','ok'); root.innerHTML='';
    });

function renderRecycleBinList(){
  const el = document.getElementById('rbList');
  if(!el) return;
  if(!DB.trash || !DB.trash.length){ el.innerHTML = '<div class="tbl-empty">سطل بازیابی خالی است.</div>'; return; }
  el.innerHTML = DB.trash.map(item=>{
    const dt = new Date(item.deletedAt);
    const when = isNaN(dt.getTime()) ? '' : dt.toLocaleString('fa-IR');
    return `<div class="note-item" style="justify-content:space-between; align-items:center;">
      <div style="min-width:0;">
        <span class="badge badge-mute" style="margin-left:6px;">${esc(TRASH_LABELS[item.type]||item.type)}</span>
        <b>${esc(trashSummary(item))}</b>
        <div class="hint" style="margin:4px 0 0;">حذف‌شده: ${esc(when)}</div>
      </div>
      <div style="display:flex; gap:6px; flex:0 0 auto;">
        <button class="btn btn-teal btn-sm" data-rbrestore="${item.id}">بازیابی</button>
        <button class="btn btn-danger btn-sm" data-rbpurge="${item.id}">حذف همیشگی</button>
      </div>
    </div>`;
  }).join('');
  el.querySelectorAll('[data-rbrestore]').forEach(b=>b.addEventListener('click', ()=> restoreFromTrash(b.dataset.rbrestore)));
  el.querySelectorAll('[data-rbpurge]').forEach(b=>b.addEventListener('click', ()=>{
    confirmDeleteModal('حذف همیشگی از سطل بازیابی', 'این رکورد برای همیشه پاک می‌شود و دیگر هیچ راهی برای بازگرداندنش نیست.', ()=> purgeFromTrash(b.dataset.rbpurge));
  }));
}

      <div><b style="font-size:13px;">🔐 رمز مدیر برای حذف</b><div class="hint" style="margin-top:2px;">قبل از هر حذف/پاک‌سازی این رمز پرسیده می‌شود تا فقط شما بتوانید داده حذف کنید.</div></div>
      <button class="btn btn-ghost btn-sm" id="changePinBtn">تغییر رمز مدیر</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="clearAllBtn">پاک‌سازی کامل داده‌های این خط</button>
      <button class="btn btn-primary" id="set_save">ذخیره تنظیمات</button>
    </div>
  </div></div>`;
  document.getElementById('sbg').addEventListener('click', e=>{ if(e.target.id==='sbg') root.innerHTML=''; });
  document.getElementById('openGsBtn').addEventListener('click', openSyncModal);
  document.getElementById('syncNowBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('syncNowBtn');
    const originalHTML = btn.innerHTML;
    btn.disabled = true; btn.textContent = 'در حال ذخیره…';
    await saveAll(false);
    if(document.getElementById('syncNowBtn')){ // modal might have been closed meanwhile
      document.getElementById('syncNowBtn').disabled = false;
      document.getElementById('syncNowBtn').innerHTML = originalHTML;
      updateSyncStatusInSettings();
    }
  });
  updateSyncStatusInSettings();
  document.getElementById('set_save').addEventListener('click', async ()=>{
    DB.meta.unitName = document.getElementById('set_unit').value;
    DB.meta.periodLabel = document.getElementById('set_period').value;
    const lineEntry = LINES.find(l=>l.id===currentLineId);
    if(lineEntry && DB.meta.unitName){ lineEntry.name = DB.meta.unitName; await saveLinesRegistry(); renderLineSwitcher(); }
    ORG.managerPhone = document.getElementById('set_phone').value.trim();
    await saveOrgSettings();
    scheduleSave(); root.innerHTML=''; toast('تنظیمات ذخیره شد.','ok');
    goTo(currentTab);
  });
  document.getElementById('clearAllBtn').addEventListener('click', ()=>{
    root.innerHTML='';
    confirmDeleteModal('پاک‌سازی کامل داده‌های این خط', 'همه ردیف‌های ثبت‌شده (تولید، ارسال، ضایعات، توقفات، کسری) برای خط «' + esc(DB.meta.unitName||'') + '» برای همیشه حذف می‌شود. این عمل قابل بازگشت نیست.', async ()=>{
      DB.daily.forEach(r=>moveToTrash('daily', r)); DB.waste.forEach(r=>moveToTrash('waste', r)); DB.stop.forEach(r=>moveToTrash('stop', r)); DB.short.forEach(r=>moveToTrash('short', r)); DB.stationHourly.forEach(r=>moveToTrash('stationHourly', r));
      DB = { daily:[], waste:[], stop:[], short:[], trash: DB.trash, stationHourly:[], meta: DB.meta };
      await saveAll(true); toast('همه داده‌های این خط پاک شد.','ok'); goTo(currentTab);
    });
  });
  document.getElementById('changePinBtn').addEventListener('click', openChangePinModal);
}
// تغییر رمز مدیر — برای اینکه هرکسی که وارد تنظیمات می‌شود نتواند رمز را دستکاری کند،
// این کار خودش به دانستن رمز فعلی نیاز دارد.
function openChangePinModal(){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-bg" id="pbg"><div class="modal">
    <h3>🔐 تغییر رمز مدیر</h3><p class="desc">این رمز قبل از هر حذف/پاک‌سازی داده پرسیده می‌شود.</p>
    <div class="field" style="margin-bottom:10px;"><label>رمز فعلی</label><input type="password" id="pin_old" autocomplete="off" inputmode="numeric"></div>
    <div class="field" style="margin-bottom:10px;"><label>رمز جدید</label><input type="password" id="pin_new" autocomplete="off" inputmode="numeric" placeholder="حداقل ۴ کاراکتر"></div>
    <div class="field" style="margin-bottom:6px;"><label>تکرار رمز جدید</label><input type="password" id="pin_new2" autocomplete="off" inputmode="numeric"></div>
    <p id="pinChangeErr" style="color:#ff5d6c; font-size:12px; display:none;"></p>
    <div class="modal-actions"><button class="btn btn-ghost" id="pinCancel">انصراف</button><button class="btn btn-primary" id="pinSave">ذخیره رمز جدید</button></div>
  </div></div>`;
  const back = ()=>{ root.innerHTML=''; openSettings(); };
  document.getElementById('pinCancel').addEventListener('click', back);
  document.getElementById('pbg').addEventListener('click', e=>{ if(e.target.id==='pbg') back(); });
  document.getElementById('pinSave').addEventListener('click', ()=>{
    const errEl = document.getElementById('pinChangeErr');
    const showErr = (msg)=>{ errEl.textContent = msg; errEl.style.display='block'; };
    const oldV = document.getElementById('pin_old').value;
    const newV = document.getElementById('pin_new').value;
    const new2 = document.getElementById('pin_new2').value;
    const correctPin = DB.meta.adminPin || '1234';
    if(oldV !== correctPin) return showErr('رمز فعلی اشتباه است.');
    if(newV.length < 4) return showErr('رمز جدید باید حداقل ۴ کاراکتر باشد.');
    if(newV !== new2) return showErr('تکرار رمز جدید با رمز جدید یکسان نیست.');
    DB.meta.adminPin = newV;
    scheduleSave();
    root.innerHTML='';
    toast('رمز مدیر تغییر کرد.','ok');
    openSettings();
  });
}

/* ---------------------------- dedicated Google Sheet sync modal ---------------------------- */
function gsStatusText(){
  if(GSHEET.url) return '🟢 متصل به گوگل‌شیت شما';
  if(cloudOK) return '🟡 وصل نشده — حالت محلی (فضای ابری Claude) فعال است.';
  return '🔴 آفلاین — هیچ اتصالی برقرار نیست.';
}
function openSyncModal(){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-bg" id="gsbg"><div class="modal">
    <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:10px;">
      <h3 style="margin:0 0 4px;">☁️ همگام‌سازی ابری (Google Sheet)</h3>
      <button class="icon-btn" id="gs_x" style="flex:0 0 auto;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <p class="desc">اگر یک Google Sheet + Apps Script طبق راهنما راه‌اندازی کرده‌اید، آدرس Web App و رمز مشترک را اینجا وارد کنید تا همه‌ی خطوط تولید و هرکسی که همین آدرس و رمز را داشته باشد، به یک منبع داده مشترک وصل شوند.</p>

    ${location.protocol==='file:' ? `<div style="background:rgba(255,93,108,.1); border:1px solid rgba(255,93,108,.35); border-radius:10px; padding:12px; margin-bottom:14px; font-size:12px; line-height:2; color:#ffb0b8;">
      ⚠️ <b>این فایل الان مستقیم از روی دیسک باز شده</b> (آدرس با <code>file:///</code> شروع می‌شود). مرورگرها اجازه نمی‌دهند این‌طور صفحاتی به گوگل وصل شوند. راه‌حل سریع: پوشه‌ی فایل را در ترمینال باز کنید و <code>python -m http.server 8000</code> بزنید، بعد از <code>http://localhost:8000</code> فایل را باز کنید. راه‌حل دائمی: فایل را روی یک وب‌سرور واقعی (سایت داخلی شرکت یا هاست رایگان) بگذارید.
    </div>` : ''}

    <div class="field" style="margin-bottom:10px;"><label>آدرس Web App:</label><input id="gs_url" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(GSHEET.url||'')}"></div>
    <div class="field" style="margin-bottom:6px;"><label>رمز مشترک (SECRET_TOKEN):</label><input id="gs_token" placeholder="توکنی که در اسکریپت گوگل تعیین کردید" value="${esc(GSHEET.token||'')}"></div>
    <div class="hint" style="margin-bottom:14px;">
      این رمز را <b>خودتان</b> در فایل <code>Code.gs</code> انتخاب می‌کنید (متغیر <code>SECRET_TOKEN</code>) — از جایی «گرفته» نمی‌شود. دقیقاً همان مقدار را اینجا هم وارد کنید (حروف بزرگ/کوچک هم باید یکی باشد).
    </div>
    <div id="gsTestResult" style="font-size:12px; font-weight:700; min-height:18px; margin-bottom:6px;"></div>

    <div class="modal-actions" style="justify-content:flex-start; flex-wrap:wrap;">
      <button class="btn btn-primary btn-sm" id="gs_save">ذخیره</button>
      <button class="btn btn-ghost btn-sm" id="gs_test">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px;"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>
        تست اتصال
      </button>
      <button class="btn btn-danger btn-sm" id="gs_disconnect">قطع اتصال</button>
    </div>
    <div class="hint" id="gsStatusLine" style="margin-top:14px; font-weight:700;">${gsStatusText()}</div>
    ${lastSyncError ? `
    <div style="margin-top:14px; background:#0e1626; border:1px solid rgba(255,93,108,.35); border-radius:10px; padding:12px;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px;">
        <b style="font-size:12px; color:#ffb0b8;">🔧 جزئیات فنی آخرین خطا</b>
        <button class="btn btn-ghost btn-sm" id="gs_copyErr" style="padding:4px 9px; font-size:10.5px;">کپی گزارش</button>
      </div>
      <div style="font-size:11px; color:var(--text-dim); line-height:2; font-family:monospace; direction:ltr; text-align:left; white-space:pre-wrap; word-break:break-all;">action: ${esc(lastSyncError.action||'')}
status: ${esc(lastSyncError.status ?? '—')}
time: ${esc(lastSyncError.when||'')}
message: ${esc(lastSyncError.message||'')}${lastSyncError.bodySnippet? '\nresponse: '+esc(lastSyncError.bodySnippet) : ''}</div>
      <div class="hint" style="margin-top:8px;">اگر مشکل ادامه داشت، همین متن را برای بررسی بفرستید.</div>
    </div>` : ''}
  </div></div>`;

  document.getElementById('gsbg').addEventListener('click', e=>{ if(e.target.id==='gsbg') root.innerHTML=''; });
  document.getElementById('gs_x').addEventListener('click', ()=> root.innerHTML='');
  const copyErrBtn = document.getElementById('gs_copyErr');
  if(copyErrBtn) copyErrBtn.addEventListener('click', ()=>{
    const report = 'action: ' + (lastSyncError.action||'') + '\nstatus: ' + (lastSyncError.status ?? '—') + '\ntime: ' + (lastSyncError.when||'') + '\nmessage: ' + (lastSyncError.message||'') + (lastSyncError.bodySnippet? ('\nresponse: '+lastSyncError.bodySnippet) : '');
    copyText(report);
  });

  document.getElementById('gs_test').addEventListener('click', async ()=>{
    const resEl = document.getElementById('gsTestResult');
    const url = document.getElementById('gs_url').value.trim();
    const token = document.getElementById('gs_token').value.trim();
    if(!url){ resEl.style.color = '#ffb0b8'; resEl.textContent = '❌ اول آدرس Web App را وارد کنید.'; return; }
    if(!token){ resEl.style.color = '#ffb0b8'; resEl.textContent = '❌ اول رمز مشترک را وارد کنید.'; return; }
    resEl.style.color = 'var(--text-mute)';
    resEl.textContent = '⏳ در حال تست نوشتن…';
    const testKey = 'tmst_connection_test';
    const testValue = { pingedAt: new Date().toISOString() };
    try{
      const postData = await gsFetch(url, {
        method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ token, key: testKey, value: JSON.stringify(testValue) })
      }, 'test-write');
      if(postData.error === 'unauthorized'){ resEl.style.color = '#ffb0b8'; resEl.textContent = '❌ رمز مشترک اشتباه است — با SECRET_TOKEN داخل کد گوگل یکی نیست.'; return; }
      if(postData.error){ resEl.style.color = '#ffb0b8'; resEl.textContent = '❌ خطای نوشتن: ' + postData.error; return; }

      resEl.textContent = '⏳ در حال تست خواندن…';
      const getData = await gsFetch(url + '?action=get&token=' + encodeURIComponent(token) + '&key=' + encodeURIComponent(testKey), undefined, 'test-read');
      if(getData.error === 'unauthorized'){ resEl.style.color = '#ffb0b8'; resEl.textContent = '❌ رمز مشترک اشتباه است.'; return; }
      if(getData.error){ resEl.style.color = '#ffb0b8'; resEl.textContent = '❌ خطای خواندن: ' + getData.error; return; }
      if(!(getData.value && JSON.parse(getData.value).pingedAt === testValue.pingedAt)){
        resEl.style.color = '#ffe19c'; resEl.textContent = '⚠️ پاسخ گرفتیم اما مقدار تست مطابقت نداشت — دوباره امتحان کنید.'; return;
      }

      resEl.textContent = '⏳ در حال تست حالت دسته‌ای (batch)…';
      const batchData = await gsFetch(url + '?action=batchGet&token=' + encodeURIComponent(token) + '&keys=' + encodeURIComponent(JSON.stringify([testKey])), undefined, 'test-batch');
      const hasBatch = !(batchData.error === 'unknown action: batchGet');

      resEl.style.color = '#8ff0c8';
      resEl.textContent = '✅ اتصال کامل موفق بود' + (hasBatch? ' (حالت سریع/دسته‌ای هم فعال است).' : ' — ولی نسخه اسکریپت شما قدیمی است (حالت دسته‌ای پشتیبانی نمی‌شود، کندتر کار می‌کند؛ Code.gs را با آخرین نسخه جایگزین کنید).') + ' می‌توانید «ذخیره» را بزنید.';
    }catch(err){
      resEl.style.color = '#ffb0b8';
      if(location.protocol === 'file:'){
        resEl.innerHTML = '❌ چون این فایل مستقیم از روی دیسک باز شده، مرورگر اجازه‌ی fetch به گوگل را نمی‌دهد — بالای همین پنجره توضیح داده شده.';
      } else if(lastSyncError && lastSyncError.action && lastSyncError.action.startsWith('test-')){
        resEl.textContent = '❌ ' + lastSyncError.message;
      } else {
        resEl.textContent = '❌ اتصال برقرار نشد — آدرس را چک کنید یا مطمئن شوید Deploy را با "Anyone" انجام داده‌اید. (' + String(err).slice(0,80) + ')';
      }
    }
  });

  document.getElementById('gs_save').addEventListener('click', async ()=>{
    const newGsUrl = document.getElementById('gs_url').value.trim();
    const newGsToken = document.getElementById('gs_token').value.trim();
    const gsChanged = newGsUrl !== (GSHEET.url||'') || newGsToken !== (GSHEET.token||'');
    GSHEET = { url: newGsUrl, token: newGsToken };
    try{ await window.storage.set('tmst_gsheet_config', JSON.stringify(GSHEET), false); }catch(e){ /* not available outside claude.ai — fine, GSHEET var still holds it for this session */ }
    toast('تنظیمات همگام‌سازی ذخیره شد.','ok');
    if(gsChanged && GSHEET.url){
      toast('اتصال به گوگل‌شیت برقرار شد — در حال بارگذاری داده‌ها…','ok');
      root.innerHTML='';
      await loadAll(); renderLineSwitcher(); goTo(currentTab);
    } else {
      document.getElementById('gsStatusLine').textContent = gsStatusText();
    }
  });

  document.getElementById('gs_disconnect').addEventListener('click', ()=>{
    if(!GSHEET.url){ toast('همین الان هم به گوگل‌شیت وصل نیستید.','ok'); return; }
    confirmModal('قطع اتصال از گوگل‌شیت', 'اتصال به گوگل‌شیت قطع می‌شود و دوباره از فضای ابری Claude استفاده خواهد شد. آدرس و رمزی که وارد کرده بودید هم پاک می‌شود (داده‌های خود گوگل‌شیت دست‌نخورده باقی می‌ماند).', async ()=>{
      GSHEET = { url:'', token:'' };
      try{ await window.storage.set('tmst_gsheet_config', JSON.stringify(GSHEET), false); }catch(e){}
      toast('اتصال گوگل‌شیت قطع شد.','ok');
      root.innerHTML='';
      await loadAll(); renderLineSwitcher(); goTo(currentTab);
    });
  });
}


/* ---------------------------- global actions ---------------------------- */
document.getElementById('settingsBtn').addEventListener('click', openSettings);
document.getElementById('syncPill').addEventListener('click', openSyncModal);
document.getElementById('saveBtn').addEventListener('click', ()=> saveAll(false));
document.getElementById('hamburgerBtn').addEventListener('click', ()=> document.getElementById('sidebar').classList.toggle('open'));
document.getElementById('trashBtn').addEventListener('click', openRecycleBin);
function updateTrashBadge(){
  const el = document.getElementById('trashCount');
  if(!el) return;
  const n = (DB.trash||[]).length;
  if(n>0){ el.style.display = 'flex'; el.textContent = n>99? '99+' : String(n); }
  else{ el.style.display = 'none'; }
}
document.getElementById('exportJsonBtn').addEventListener('click', ()=>{
  downloadFile('پشتیبان-' + (DB.meta.unitName||'داشبورد') + '.json', JSON.stringify(DB, null, 1), 'application/json');
  toast('فایل پشتیبان دانلود شد.','ok');
});
document.getElementById('importJsonBtn').addEventListener('click', ()=> document.getElementById('importJsonInput').click());
document.getElementById('importJsonInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(err){ toast('فایل پشتیبان معتبر نیست.','err'); e.target.value=''; return; }
    if(!parsed || !Array.isArray(parsed.daily)){ toast('ساختار فایل پشتیبان شناسایی نشد.','err'); e.target.value=''; return; }
    confirmDeleteModal('بازیابی از فایل پشتیبان',
      'داده‌های فعلی خط «' + (DB.meta.unitName||'') + '» (' + DB.daily.length + ' روز ثبت‌شده) با محتوای این فایل جایگزین می‌شود. وضعیت فعلی قبل از جایگزینی به سطل بازیابی منتقل می‌شود.',
      ()=>{
        DB.daily.forEach(r=>moveToTrash('daily', r));
        DB.waste.forEach(r=>moveToTrash('waste', r));
        DB.stop.forEach(r=>moveToTrash('stop', r));
        DB.short.forEach(r=>moveToTrash('short', r));
        const keepTrash = DB.trash;
        DB = {
          daily: normalizeDailyArray(parsed.daily || []), waste: parsed.waste || [], stop: parsed.stop || [],
          short: parsed.short || [], trash: parsed.trash && parsed.trash.length ? parsed.trash : keepTrash,
          stationHourly: parsed.stationHourly || [],
          meta: parsed.meta || DB.meta
        };
        scheduleSave(); updateTrashBadge(); toast('بازیابی از فایل پشتیبان انجام شد.','ok'); goTo(currentTab);
      }, 'بازیابی کن');
    e.target.value = '';
  };
  reader.readAsText(file, 'utf-8');
});
document.getElementById('lineSwitchSelect').addEventListener('change', e=> switchToLine(e.target.value));
document.getElementById('addLineBtn').addEventListener('click', ()=>{
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-bg" id="albg"><div class="modal">
    <h3>➕ افزودن خط تولید جدید</h3>
    <p class="desc">یک فضای کاری کاملاً جدا (ورود داده، تولید، ارسال، کسری، ضایعات، توقفات) برای این خط ساخته می‌شود.</p>
    <div class="field" style="margin-bottom:16px;"><label>نام خط تولید</label><input id="al_name" placeholder="مثال: واحد پمپ آب"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="al_cancel">انصراف</button>
      <button class="btn btn-primary" id="al_ok">ایجاد خط</button>
    </div>
  </div></div>`;
  document.getElementById('albg').addEventListener('click', e=>{ if(e.target.id==='albg') root.innerHTML=''; });
  document.getElementById('al_cancel').addEventListener('click', ()=> root.innerHTML='');
  document.getElementById('al_ok').addEventListener('click', async ()=>{
    const name = document.getElementById('al_name').value.trim();
    if(!name){ toast('نام خط تولید را وارد کنید.','err'); return; }
    root.innerHTML = '';
    await addNewLine(name);
  });
});

/* ---------------------------- boot ---------------------------- */
(async function init(){
  if(!GSHEET.url){
    try{
      const r = await window.storage.get('tmst_gsheet_config', false);
      if(r){ const cfg = JSON.parse(r.value); if(cfg && cfg.url) GSHEET = cfg; }
    }catch(e){ /* not available — fine, stays on window.storage or offline */ }
  }
  await loadAll();
  renderLineSwitcher();
  renderNav();
  goTo('dash');
  if(!hasCloudBackend()){
    setTimeout(()=> toast('هنوز به هیچ فضای ابری وصل نیستید — روی نوار پایین سایدبار بزنید تا گوگل‌شیت را وصل کنید.', 'err'), 900);
  }
})();
</script>
