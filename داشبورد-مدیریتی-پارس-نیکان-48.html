<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>داشبورد مدیریتی پارس نیکان صنعت خودرو — خطوط تولید</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js';document.head.appendChild(s);"></script>
<style>
:root{
  --bg:#0c1220;
  --bg-soft:#101827;
  --panel:#141d31;
  --panel-2:#182338;
  --panel-border:#243252;
  --line:#1f2b45;
  --text:#eef2f9;
  --text-dim:#aab4c8;
  --text-mute:#7c8aa5;
  --amber:#ff9d42;
  --amber-2:#ffb968;
  --teal:#2fd9c4;
  --blue:#4c8dff;
  --red:#ff5d6c;
  --yellow:#ffcf5c;
  --purple:#b389ff;
  --radius:14px;
  --radius-sm:9px;
  --shadow: 0 10px 30px -12px rgba(0,0,0,.55);
  --mono: 'Vazirmatn', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0; overflow-x:hidden; max-width:100vw;}
body{
  background:
    radial-gradient(1100px 500px at 85% -10%, rgba(76,141,255,.10), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(255,157,66,.08), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:'Vazirmatn', sans-serif;
  min-height:100vh;
  font-feature-settings:"tnum" 1;
}
::selection{ background:rgba(255,157,66,.35); }
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#26324e;border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:#334268;}

a{color:inherit;}
button{font-family:inherit;}

/* ===== layout ===== */
.app{ display:flex; min-height:100vh; }
.sidebar{
  width:250px; flex:0 0 250px;
  background:linear-gradient(180deg, #0e1626 0%, #0a0f1c 100%);
  border-left:1px solid var(--panel-border);
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; z-index:40;
}
.brand{ padding:22px 20px 16px; border-bottom:1px solid var(--line); }
.brand .mark{
  width:42px;height:42px;border-radius:11px;
  background:linear-gradient(135deg, var(--amber), #ff6f3d);
  display:flex;align-items:center;justify-content:center;
  font-weight:900; font-size:18px; color:#1a0f05; box-shadow:0 6px 18px -6px rgba(255,120,50,.6);
}
.brand-row{ display:flex; align-items:center; gap:12px; }
.brand h1{ font-size:15px; margin:0; font-weight:800; letter-spacing:.2px;}
.brand p{ margin:2px 0 0; font-size:11.5px; color:var(--text-mute); }

.nav{ flex:1; padding:14px 12px; overflow-y:auto; }
.nav-item{
  display:flex; align-items:center; gap:11px;
  padding:11px 12px; border-radius:10px; margin-bottom:4px;
  color:var(--text-dim); cursor:pointer; font-size:13.5px; font-weight:600;
  border:1px solid transparent; transition:all .15s ease; user-select:none;
}
.nav-item svg{ width:18px;height:18px;flex:0 0 18px; opacity:.85; }
.nav-item:hover{ background:var(--panel); color:var(--text); }
.nav-item.active{
  background:linear-gradient(90deg, rgba(255,157,66,.16), rgba(255,157,66,.03));
  border-color:rgba(255,157,66,.35); color:#ffd4a8;
}
.nav-item.active svg{ opacity:1; }
.nav-sep{ height:1px; background:var(--line); margin:10px 6px; }
.nav-label{ font-size:10.5px; color:var(--text-mute); padding:8px 12px 4px; letter-spacing:.5px; }

.sidebar-foot{ padding:14px 16px 18px; border-top:1px solid var(--line); }
.sync-pill{
  display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--text-mute);
  background:var(--panel); border:1px solid var(--panel-border); border-radius:10px; padding:9px 10px;
}
.sync-dot{ width:8px;height:8px;border-radius:50%; background:var(--teal); box-shadow:0 0 0 3px rgba(47,217,196,.18); flex:0 0 8px;}
.sync-dot.off{ background:var(--red); box-shadow:0 0 0 3px rgba(255,93,108,.18); }
.sync-dot.busy{ background:var(--yellow); box-shadow:0 0 0 3px rgba(255,207,92,.18); animation:pulse 1s infinite; }
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }

.main{ flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:16px 26px; background:rgba(12,18,32,.85); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar h2{ margin:0; font-size:18px; font-weight:800; }
.topbar .sub{ font-size:12px; color:var(--text-mute); margin-top:2px; }
.topbar-actions{ display:flex; gap:8px; align-items:center; }
.hamburger{ display:none; }

.view{ padding:22px 26px 60px; }

/* ===== buttons ===== */
.btn{
  display:inline-flex; align-items:center; gap:7px; justify-content:center;
  padding:9px 14px; border-radius:10px; border:1px solid var(--panel-border);
  background:var(--panel-2); color:var(--text); font-size:12.5px; font-weight:700;
  cursor:pointer; transition:.15s; white-space:nowrap;
}
.btn:hover{ background:#1d2942; border-color:#324268; transform:translateY(-1px); }
.btn svg{ width:15px;height:15px; }
.btn-primary{ background:linear-gradient(135deg, var(--amber), #ff6f3d); border-color:transparent; color:#1a0f05; }
.btn-primary:hover{ filter:brightness(1.08); }
.btn-teal{ background:linear-gradient(135deg, var(--teal), #17b7a4); border-color:transparent; color:#022420; }
.btn-ghost{ background:transparent; border-color:var(--panel-border); }
.btn-danger{ background:rgba(255,93,108,.12); color:#ffb3ba; border-color:rgba(255,93,108,.3); }
.btn-sm{ padding:6px 10px; font-size:11.5px; border-radius:8px; }
.btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; }
.icon-btn{
  width:32px;height:32px;border-radius:8px; display:inline-flex; align-items:center; justify-content:center;
  background:var(--panel-2); border:1px solid var(--panel-border); cursor:pointer; color:var(--text-dim);
}
.icon-btn:hover{ color:var(--text); border-color:#324268; }
.icon-btn svg{ width:15px;height:15px; }

/* ===== cards / grid ===== */
.grid{ display:grid; gap:14px; }
.grid-4{ grid-template-columns:repeat(4,1fr); }
.grid-3{ grid-template-columns:repeat(3,1fr); }
.grid-2{ grid-template-columns:repeat(2,1fr); }
@media(max-width:1200px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} }
@media(max-width:640px){ .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;} .cover-head-grid{grid-template-columns:1fr !important;} }

.card{
  background:linear-gradient(180deg, var(--panel), var(--panel-2));
  border:1px solid var(--panel-border); border-radius:var(--radius);
  padding:18px; box-shadow:var(--shadow);
}
.card.tight{ padding:14px; }
.card h3{ margin:0 0 14px; font-size:13.5px; font-weight:800; color:var(--text); display:flex; align-items:center; justify-content:space-between; gap:8px;}
.card h3 .muted{ font-size:11px; color:var(--text-mute); font-weight:600; }
.mini-title{ font-size:12px; font-weight:700; color:var(--text-dim); margin-bottom:6px; }
.mini-title .muted{ font-size:10.5px; color:var(--text-mute); font-weight:600; }
.mini-chart-card{ background:#0e1626; border:1px solid var(--panel-border); border-radius:10px; padding:10px 12px; }
@media(max-width:640px){ .mini-chart-card{ padding:12px 14px; } }
.chk-row{ display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--text-mute); cursor:pointer; user-select:none; }
.chk-row input{ width:auto; }

.kpi{ position:relative; overflow:hidden; }
.kpi .tag{ font-size:11px; color:var(--text-mute); font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:6px;}
.kpi .val{ font-size:26px; font-weight:900; letter-spacing:.2px; }
.kpi .unit{ font-size:12px; color:var(--text-mute); font-weight:700; margin-right:4px;}
.kpi .delta{ margin-top:8px; font-size:11.5px; font-weight:700; display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:20px; }
.kpi .delta.up{ color:#8ff0c8; background:rgba(47,217,196,.12);}
.kpi .delta.down{ color:#ffb0b8; background:rgba(255,93,108,.12);}
.kpi .delta.flat{ color:var(--text-mute); background:rgba(255,255,255,.05);}
.kpi .glow{ position:absolute; left:-30px; top:-30px; width:110px;height:110px;border-radius:50%; filter:blur(30px); opacity:.35; }

.bar-track{ height:7px; border-radius:6px; background:#1a2438; overflow:hidden; margin-top:10px; }
.bar-fill{ height:100%; border-radius:6px; background:linear-gradient(90deg, var(--amber), var(--amber-2)); }

/* ===== tables ===== */
.table-wrap{ overflow-x:auto; border-radius:12px; border:1px solid var(--panel-border); }
table{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:640px; }
thead th{
  text-align:right; padding:11px 12px; background:#0f1729; color:var(--text-mute);
  font-weight:700; font-size:11px; letter-spacing:.2px; border-bottom:1px solid var(--panel-border);
  white-space:nowrap; position:sticky; top:0;
}
tbody td{ padding:10px 12px; border-bottom:1px solid var(--line); color:var(--text-dim); white-space:nowrap; }
tbody tr:hover{ background:rgba(255,255,255,.02); }
tbody tr:last-child td{ border-bottom:none; }
td.num, th.num{ text-align:left; font-variant-numeric:tabular-nums; direction:ltr; }
.tbl-empty{ padding:34px 10px; text-align:center; color:var(--text-mute); font-size:12.5px; }

.badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; }
.cover-clickable{ transition:transform .15s ease, box-shadow .15s ease, background .15s ease; }
.cover-clickable:hover{ transform:translateY(-2px); box-shadow:0 10px 26px rgba(0,0,0,.35); background:rgba(255,255,255,.03); }
.badge-stop{ background:rgba(255,93,108,.14); color:#ffb0b8; }
.badge-run{ background:rgba(47,217,196,.14); color:#8ff0c8; }
.badge-warn{ background:rgba(255,207,92,.14); color:#ffe19c; }
.badge-mute{ background:rgba(255,255,255,.06); color:var(--text-mute); }
.badge-blue{ background:rgba(76,141,255,.14); color:#a9c6ff; }

/* ===== forms ===== */
.form-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
@media(max-width:900px){ .form-grid{ grid-template-columns:repeat(2,1fr);} }
.field label{ display:block; font-size:11.5px; font-weight:700; color:var(--text-mute); margin-bottom:6px; }
.field input, .field select, .field textarea{
  width:100%; background:#0e1626; border:1px solid var(--panel-border); color:var(--text);
  border-radius:9px; padding:9px 11px; font-size:13px; font-family:inherit; outline:none; transition:.15s;
}
.field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--amber); box-shadow:0 0 0 3px rgba(255,157,66,.12); }
.field textarea{ resize:vertical; min-height:56px; }
.field.span-2{ grid-column:span 2; }
.field.span-4{ grid-column:span 4; }
.hint{ font-size:10.5px; color:var(--text-mute); margin-top:5px; }
.section-title{ font-size:12px; font-weight:800; color:var(--amber-2); margin:18px 0 10px; display:flex; align-items:center; gap:8px;}
.section-title:first-child{ margin-top:0; }
.section-title .ln{ flex:1; height:1px; background:var(--line);}

/* ===== chart wraps ===== */
.chart-box{ position:relative; height:280px; }
.chart-box.sm{ height:210px; }

/* ===== misc ===== */
.flexbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px;}
.pills{ display:flex; gap:8px; flex-wrap:wrap; }
.pill{ padding:7px 13px; border-radius:20px; font-size:12px; font-weight:700; background:var(--panel-2); border:1px solid var(--panel-border); color:var(--text-dim); cursor:pointer; }
.pill.active{ background:rgba(255,157,66,.15); border-color:rgba(255,157,66,.4); color:#ffd4a8; }
.search{ position:relative; min-width:220px; }
.search input{ width:100%; background:#0e1626; border:1px solid var(--panel-border); border-radius:10px; padding:9px 13px 9px 13px; color:var(--text); font-size:12.5px; }
.note-list{ display:flex; flex-direction:column; gap:8px; }
.note-item{ background:var(--panel-2); border:1px solid var(--panel-border); border-radius:10px; padding:10px 12px; font-size:12px; color:var(--text-dim); display:flex; gap:10px; align-items:flex-start;}
.note-item b{ color:var(--text); font-weight:700; }
.insight{
  display:flex; gap:12px; align-items:flex-start; padding:13px 14px; border-radius:12px;
  background:var(--panel-2); border:1px solid var(--panel-border); margin-bottom:10px;
}
.insight .ico{ width:34px;height:34px;border-radius:9px; display:flex; align-items:center; justify-content:center; flex:0 0 34px; }
.insight p{ margin:0; font-size:12.8px; line-height:1.9; color:var(--text-dim); }
.insight b{ color:var(--text); }
.empty-state{ text-align:center; padding:50px 20px; color:var(--text-mute); }
.empty-state svg{ width:46px;height:46px; margin-bottom:12px; opacity:.5; }

.toast-wrap{ position:fixed; bottom:22px; left:22px; z-index:200; display:flex; flex-direction:column; gap:8px; }
.toast{
  background:#101c2e; border:1px solid var(--panel-border); color:var(--text); padding:11px 16px;
  border-radius:10px; font-size:12.5px; font-weight:600; box-shadow:var(--shadow); display:flex; align-items:center; gap:9px;
  animation:toastIn .25s ease;
}
.toast.ok{ border-color:rgba(47,217,196,.4); }
.toast.err{ border-color:rgba(255,93,108,.4); }
@keyframes toastIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

.modal-bg{ position:fixed; inset:0; background:rgba(6,9,16,.72); backdrop-filter:blur(3px); z-index:150; display:flex; align-items:center; justify-content:center; padding:20px; }
.modal{ background:var(--panel); border:1px solid var(--panel-border); border-radius:16px; width:100%; max-width:480px; padding:22px; box-shadow:var(--shadow); }
.modal h3{ margin:0 0 4px; font-size:16px; }
.modal p.desc{ color:var(--text-mute); font-size:12.5px; margin:0 0 16px; }
.modal-actions{ display:flex; gap:10px; margin-top:18px; justify-content:flex-end; }

.legend-row{ display:flex; flex-wrap:wrap; gap:14px; margin-top:10px; }
.legend-dot{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-dim); }
.legend-dot i{ width:9px;height:9px;border-radius:3px; display:inline-block; }

.top-strip{ display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; margin-bottom:16px;}
.strip-card{ flex:0 0 auto; min-width:150px; background:var(--panel-2); border:1px solid var(--panel-border); border-radius:12px; padding:12px 14px;}
.strip-card .l{ font-size:10.5px; color:var(--text-mute); font-weight:700;}
.strip-card .v{ font-size:18px; font-weight:900; margin-top:4px;}

@media(max-width:960px){
  .sidebar{ position:fixed; right:0; top:0; transform:translateX(100%); transition:transform .25s; width:78vw; max-width:290px;}
  .sidebar.open{ transform:translateX(0); }
  .hamburger{ display:flex; }
  .form-grid{ grid-template-columns:repeat(2,1fr); }
  .view{ padding:16px 14px 50px;}
  .topbar{ padding:14px 16px; }
}
@media print{
  .sidebar, .topbar-actions, .hamburger{ display:none !important; }
  body{ background:#fff; color:#000; }
  .card{ break-inside:avoid; border-color:#ccc; background:#fff; box-shadow:none;}
}
</style>
</head>

/* ---------------------------- utils ---------------------------- */
function uid(){ return 'id' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function toEnDigits(s){ return String(s ?? '').replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); }
function num(v){ if(v===''||v===null||v===undefined) return null; const n = parseFloat(toEnDigits(v)); return isNaN(n) ? null : n; }
function fmt(v, digits){
  if(v===null||v===undefined||v==='') return '—';
  const n = typeof v==='number'?v:num(v);
  if(n===null) return String(v);
  return n.toLocaleString('en-US', {maximumFractionDigits: digits ?? 1, minimumFractionDigits:0});
}
function pct(v,digits){ if(v===null||v===undefined||isNaN(v)) return '—'; return (v*100).toLocaleString('en-US',{maximumFractionDigits:digits??1}) + '٪'; }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function jalaliToGregorian(jy,jm,jd){
  jy = parseInt(jy,10); jm = parseInt(jm,10); jd = parseInt(jd,10);
  jy += 1595;
  let days = -355668 + (365*jy) + (Math.floor(jy/33)*8) + Math.floor(((jy%33)+3)/4) + jd + (jm<7 ? (jm-1)*31 : ((jm-7)*30)+186);
  let gy = 400*Math.floor(days/146097);
  days %= 146097;
  if(days>36524){
    gy += 100*Math.floor(--days/36524);
    days %= 36524;
    if(days>=365) days++;
  }
  gy += 4*Math.floor(days/1461);
  days %= 1461;
  if(days>365){ gy += Math.floor((days-1)/365); days = (days-1)%365; }
  let gd = days+1;
  const leap = (gy%4===0 && gy%100!==0) || gy%400===0;
  const sal = [0,31,leap?29:28,31,30,31,30,31,31,30,31,30,31];
  let gm=0;
  for(gm=0; gm<13; gm++){ if(gd<=sal[gm]) break; gd -= sal[gm]; }
  return [gy, gm, gd];
}
// عکس jalaliToGregorian — تاریخ میلادی امروز را به شمسی «۱۴۰۵/۰۵/۲۰» تبدیل می‌کند (برای نمایشگر ساعت/تاریخ)
function gregorianToJalali(gy,gm,gd){
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy<=1600)? 0 : 979;
  gy -= (gy<=1600)? 621 : 1600;
  const gy2 = (gm>2)? (gy+1) : gy;
  let days = (365*gy) + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100) + Math.floor((gy2+399)/400) - 80 + gd + g_d_m[gm-1];
  jy += 33*Math.floor(days/12053); days %= 12053;
  jy += 4*Math.floor(days/1461); days %= 1461;
  jy += Math.floor((days-1)/365); if(days>365) days = (days-1)%365;
  const jm = (days<186)? 1+Math.floor(days/31) : 7+Math.floor((days-186)/30);
  const jd = (days<186)? 1+(days%31) : 1+((days-186)%30);
  return [jy, jm, jd];
}
function todayJalaliStr(){
  const now = new Date();
  const [jy,jm,jd] = gregorianToJalali(now.getFullYear(), now.getMonth()+1, now.getDate());
  return jy+'/'+String(jm).padStart(2,'0')+'/'+String(jd).padStart(2,'0');
}
function weekdayFromJalali(dateStr){
  try{
    const parts = toEnDigits(dateStr).split('/').map(s=>s.trim());
    if(parts.length<3) return '';
    const [gy,gm,gd] = jalaliToGregorian(parts[0],parts[1],parts[2]);
    const d = new Date(gy, gm-1, gd);
    if(isNaN(d.getTime())) return '';
    return WEEKDAYS_BY_JSDAY[d.getDay()];
  }catch(e){ return ''; }
}
function normDate(s){ return toEnDigits(s).trim(); }
function dateSortKey(s){
  const p = normDate(s).split('/').map(x=>parseInt(x,10)||0);
  return (p[0]||0)*10000 + (p[1]||0)*100 + (p[2]||0);
}

/* ---------------------------- month archive helpers ---------------------------- */
const FA_MONTH_NAMES = ['','فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function monthKeyOf(dateStr){
  const p = normDate(dateStr).split('/');
  if(p.length<2 || !p[0] || !p[1]) return '';
  return p[0] + '/' + String(parseInt(p[1],10)).padStart(2,'0');
}
function monthLabel(key){
  if(!key) return '—';
  const p = String(key).split('/'); const mIdx = parseInt(p[1],10);
  return (FA_MONTH_NAMES[mIdx] || ('ماه '+mIdx)) + ' ماه ' + p[0];
}
function monthSortVal(key){
  const p = String(key).split('/').map(x=>parseInt(x,10)||0);
  return (p[0]||0)*100 + (p[1]||0);
}
function addMonths(key, delta){
  let [y,m] = String(key).split('/').map(x=>parseInt(x,10));
  m += delta;
  while(m>12){ m-=12; y+=1; }
  while(m<1){ m+=12; y-=1; }
  return y + '/' + String(m).padStart(2,'0');
}
function allMonthKeys(){
  const set = new Set();
  DB.daily.forEach(e=>{ const k=monthKeyOf(e.date); if(k) set.add(k); });
  DB.waste.forEach(e=>{ const k=monthKeyOf(e.date); if(k) set.add(k); });
  DB.stop.forEach(e=>{ const k=monthKeyOf(e.date); if(k) set.add(k); });
  DB.short.forEach(e=>{ const k=monthKeyOf(e.date); if(k) set.add(k); });
  (DB.stationHourly||[]).forEach(e=>{ const k=monthKeyOf(e.date); if(k) set.add(k); });
  (DB.meta.months||[]).forEach(k=>{ if(k) set.add(k); });
  if(DB.meta.activeMonth) set.add(DB.meta.activeMonth);
  return [...set].sort((a,b)=> monthSortVal(b)-monthSortVal(a));
}
function monthData(){
  const mk = DB.meta.activeMonth;
  return {
    daily: DB.daily.filter(e=>monthKeyOf(e.date)===mk),
    waste: DB.waste.filter(e=>monthKeyOf(e.date)===mk),
    stop: DB.stop.filter(e=>monthKeyOf(e.date)===mk),
    short: DB.short.filter(e=>monthKeyOf(e.date)===mk),
    stationHourly: (DB.stationHourly||[]).filter(e=>monthKeyOf(e.date)===mk),
  };
}

function toast(msg, type){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + (type||'');
  el.innerHTML = (type==='ok' ? '✓ ' : type==='err' ? '⚠ ' : '') + esc(msg);
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2600);
}

function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type: mime || 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function toCSV(headers, rows){
  const esc2 = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  return '\uFEFF' + [headers.map(esc2).join(','), ...rows.map(r=>r.map(esc2).join(','))].join('\n');
}

/* ---------------------------- data model helpers ---------------------------- */
function parseCell(raw){
  if(raw===''||raw===null||raw===undefined) return {status:'', qty:null};
  if(String(raw).trim()==='توقف') return {status:'stop', qty:0};
  const n = num(raw);
  return {status:'run', qty: n===null?0:n};
}
const ALL_LINE_KEYS = ['line1','line2','line3','line4','ckd','se206','darpoosh','diesel'];
// Backfills any line key missing from older saved/seeded records (e.g. when a new
// tracked line like "دیزل/بنز" is added later) so nothing throws on old data.
function normalizeDailyArray(arr){
  return (arr||[]).map(e=>{
    e.lines = e.lines || {};
    ALL_LINE_KEYS.forEach(k=>{ if(!e.lines[k]) e.lines[k] = {status:'run', qty:null}; });
    if(e.lines.line4.transferFromDiesel===undefined) e.lines.line4.transferFromDiesel = null;
    return e;
  });
}
function seedDaily(){
  return SEED.daily.map(r=>{
    const [date,day,l1q,l1p,l2q,l2p,l3q,l3p,l4q,l4p,ckd,se206,darpoosh,
      s_tk,s_b71,s_c89,s_c76,s_c83,s_l90,s_sn,s_sh,s_jk,s_s206,s_shp,
      short,stop,waste,prob] = r;
    return {
      id: uid(), date, day: day || weekdayFromJalali(date),
      lines:{
        line1: {...parseCell(l1q), product: l1p||''},
        line2: {...parseCell(l2q), product: l2p||''},
        line3: {...parseCell(l3q), product: l3p||''},
        line4: {...parseCell(l4q), product: l4p||''},
        ckd: parseCell(ckd), se206: parseCell(se206), darpoosh: parseCell(darpoosh), diesel: {status:'run', qty:null},
      },
      ship:{ termostat_koli:num(s_tk), benz71:num(s_b71), ckd89:num(s_c89), ckd76:num(s_c76), ckd83:num(s_c83),
        l90:num(s_l90), sayna:num(s_sn), shahin:num(s_sh), jack:num(s_jk), se206:num(s_s206), shahinpas:num(s_shp) },
      notes:{ shortage: short||'', stoppage: stop||'', waste: waste||'', problems: prob||'' }
    };
  }).sort((a,b)=>dateSortKey(a.date)-dateSortKey(b.date));
}
function seedWaste(){
  return SEED.waste.map(r=>{
    const [date,station,part,operator,produced,wasteType,wasteCount,category] = r;
    return { id: uid(), date: normDate(date), station: station||'', part: part||'', operator: operator||'',
      produced: num(produced), wasteType: wasteType||'', wasteCount: num(wasteCount)||0, category: category||'سایر' };
  });
}
function seedStop(){
  return SEED.stop.filter(r=>r[0]).map(r=>{
    const [date,station,durationValue,unit,hours,reason,description] = r;
    return { id: uid(), date: normDate(date), station: (station||'').trim(), durationValue: num(durationValue),
      unit: unit||'ساعت', hours: num(hours)||0, reason: reason||'سایر', description: description||'' };
  });
}
function seedShort(){
  const out = [];
  SEED.short.forEach(r=>{
    const [date, text] = r;
    String(text||'').split('|').map(s=>s.trim()).filter(Boolean).forEach(part=>{
      out.push({ id: uid(), date: normDate(date), part, description:'', status:'در انتظار تامین', qty:null });
    });
  });
  return out;
}

function importDiagramStations(){

  diagramStations().forEach(d=>{
    const existing = DB.meta.stations.find(s=>s.name===d.name);
    if(existing){
      existing.dailyTarget = d.dailyTarget;
      existing.hourlyStandard = Math.round(d.dailyTarget/10);
      existing.stage = d.stage; existing.hasStopIssue = d.hasStopIssue; existing.estimated = !!d.estimated;
    } else {
      DB.meta.stations.push({ id:uid(), name:d.name, hourlyStandard: Math.round(d.dailyTarget/10), dailyTarget:d.dailyTarget,
        stage:d.stage, hasStopIssue:d.hasStopIssue, estimated: !!d.estimated });
    }
  });
}

// روزهای تعطیل/نیمه‌شیفت شیفت کوتاه‌تری دارند (مثلاً ۸ ساعت به‌جای ۱۰ ساعت عادی) و طبیعتاً
// تولید کمتری می‌دهند — این تابع نسبت واقعی آن روز را نسبت به یک روز عادی برمی‌گرداند
// تا هدف روزانه هر خط/ایستگاه متناسب با آن کوچک شود، نه این‌که به‌اشتباه «کسری» ثبت شود.
function dayShiftFactor(e){
  const normal = DB.meta.normalShiftHours || 10;
  const hrs = (e && e.shiftHours) || normal;
  return normal ? hrs/normal : 1;
}
// برآورد نرخ استاندارد ساعتی هر ایستگاه از روی متن آزادِ ثبت‌شده در «توقفات تولید».
// چون نام ایستگاه دستی تایپ می‌شود (مثلاً «مونتاژنهایی 1»، «پرچ سیلندر1» یا چند ایستگاه با «|»)،
// اول تطبیق دقیق، بعد تطبیق فازی (نادیده‌گرفتن فاصله/اعداد/علائم) امتحان می‌شود. اگر هیچ ایستگاهی
// تطبیق نخورد، قبل از میانگین کل خط، ابتدا بررسی می‌شود که آیا نام به یکی از زیرخط‌های شناخته‌شده
// (CKD/سه‌راهی۲۰۶/درپوش/دیزل-بنز) تعلق دارد — چون این‌ها هدف/نرخ اختصاصی و معمولاً بسیار کمتر از
// میانگین کل خط دارند (مثلاً «بای‌پس بنز» با نرخ میانگین کل خط اشتباه گرفته می‌شد و عدد ازدست‌رفته
// را چند برابر واقعی نشان می‌داد). فقط اگر هیچ‌کدام مشخص نبود، میانگین نرخ کل ایستگاه‌ها به‌عنوان
// آخرین برآورد استفاده می‌شود (نه صفر) تا هیچ توقفی از تحلیل‌های ریشه‌یابی حذف نشود.
const _stationRateCache = {};
function resolveStationRate(stationText){
  const normTxt = s => String(s||'').replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[()|]/g,' ').replace(/\s+/g,' ').trim();
  const squash = s => normTxt(s).replace(/[0-9۰-۹]/g,'').replace(/\s+/g,'');
  const cacheKey = stationText+'|'+((DB.meta.stations||[]).length)+'|'+(DB.meta.dieselTarget||0)+'|'+(DB.meta.ckdTarget||0);
  if(_stationRateCache[cacheKey]!==undefined) return _stationRateCache[cacheKey];
  // ایستگاه‌هایی که هنوز «استاندارد ساعتی» برایشان ثبت نشده (تازه اضافه شده‌اند، هنوز صفرند) نباید نه در
  // میانگین کل خط اثر بگذارند و نه به‌عنوان «تطبیق واقعی» حساب شوند — وگرنه یک تطبیق دقیق ولی صفر،
  // برآورد را به‌جای بهتر شدن بدتر می‌کند. فقط ایستگاه‌های واقعاً مقداردهی‌شده لحاظ می‌شوند.
  const stationList = (DB.meta.stations||[]).map(s=>({name:s.name, sq:squash(s.name), rate:s.hourlyStandard||0})).filter(s=>s.rate>0);
  const avgStationRate = stationList.length ? stationList.reduce((s,x)=>s+x.rate,0)/stationList.length : 0;
  const sq = squash(stationText);
  let matches = [];
  if(sq){ matches = stationList.filter(s=> s.sq && (sq.includes(s.sq) || s.sq.includes(sq))); }
  let rate;
  if(matches.length){
    rate = matches.reduce((s,x)=>s+x.rate,0)/matches.length;
  } else {
    const normalHrs = DB.meta.normalShiftHours || 10;
    const n = stationText||'';
    let subTarget = null;
    if(/CKD/i.test(n)) subTarget = DB.meta.ckdTarget;
    else if(/سه.?راهی.?۲۰۶|سه.?راهی.?206|206/.test(n)) subTarget = DB.meta.se206Target;
    else if(/درپوش/.test(n)) subTarget = DB.meta.darpooshTarget;
    else if(/دیزل|بنز/.test(n)) subTarget = DB.meta.dieselTarget || DIESEL_TARGET_DEFAULT;
    rate = (subTarget && normalHrs) ? subTarget/normalHrs : avgStationRate;
  }
  _stationRateCache[cacheKey] = rate;
  return rate;
}
// رتبه‌بندی یکپارچه علل توقف بر اساس برآورد تولید ازدست‌رفته (ساعت × نرخ ایستگاه)
function stopLossRanking(stopArr){
  const byReason = {};
  stopArr.forEach(x=>{
    const rate = resolveStationRate(x.station);
    const k = x.reason || 'سایر';
    if(!byReason[k]) byReason[k] = {hours:0, lostQty:0};
    byReason[k].hours += (x.hours||0);
    byReason[k].lostQty += (x.hours||0)*rate;
  });
  return Object.entries(byReason).map(([label,v])=>({label,...v})).sort((a,b)=>b.lostQty-a.lostQty || b.hours-a.hours);
}
// رگرسیون خطی ساده روی مجموعه‌ای از مقادیر روزانه — برای پیش‌بینی روند آینده استفاده می‌شود
function linearTrend(values){
  const n = values.length;
  if(n<2) return { slope:0, intercept: n? values[0]:0, n };
  let sx=0,sy=0,sxy=0,sxx=0;
  values.forEach((y,x)=>{ sx+=x; sy+=y; sxy+=x*y; sxx+=x*x; });
  const denom = n*sxx - sx*sx;
  const slope = denom? (n*sxy - sx*sy)/denom : 0;
  const intercept = (sy - slope*sx)/n;
  return { slope, intercept, n };
}
// نیمه اول/دوم بازه فعلی را بر اساس تاریخ‌های واقعاً ثبت‌شده جدا می‌کند — مبنای تشخیص روند صعودی/نزولی
// شاخص‌های ریسک (توقف، ضایعات، کسری) در همین ماه، بدون نیاز به تاریخچه چند ماهه.
function dateHalves(rows){
  if(rows.length<4) return null;
  const dates = rows.map(e=>e.date);
  const mid = Math.floor(dates.length/2);
  return { firstDates: new Set(dates.slice(0,mid)), secondDates: new Set(dates.slice(mid)), firstN: mid, secondN: dates.length-mid };
}
// نرخ روزانه یک آرایه رویداد (توقف/ضایعات/کسری) را در نیمه اول و دوم بازه مقایسه می‌کند
function halfTrend(arr, halves, valueFn){
  if(!halves) return null;
  const firstSum = arr.filter(x=>halves.firstDates.has(x.date)).reduce((s,x)=>s+valueFn(x),0);
  const secondSum = arr.filter(x=>halves.secondDates.has(x.date)).reduce((s,x)=>s+valueFn(x),0);
  const firstRate = halves.firstN? firstSum/halves.firstN : 0;
  const secondRate = halves.secondN? secondSum/halves.secondN : 0;
  const deltaPct = firstRate? (secondRate-firstRate)/firstRate : (secondRate>0? 1 : 0);
  return { firstRate, secondRate, deltaPct };
}
// Fair, day-specific target: a line that was marked "توقف" that day isn't counted
// against the target for that day (matches how CKD/se206/darpoosh/diesel targets
// already only count active days). Prevents an unfairly inflated deviation on days
// when a line was legitimately down.
function dayTarget4Lines(e){
  const t = DB.meta.lineTarget || LINE_TARGET_DEFAULT;
  return ['line1','line2','line3','line4'].filter(k=>e.lines[k].status!=='stop').length * t * dayShiftFactor(e);
}
function dayCombinedTarget(e){
  const f = dayShiftFactor(e);
  const ckdT = (DB.meta.ckdTarget||0)*f, se206T = (DB.meta.se206Target||0)*f, darpooshT = (DB.meta.darpooshTarget||0)*f, dieselT = (DB.meta.dieselTarget||DIESEL_TARGET_DEFAULT)*f;
  let t = dayTarget4Lines(e);
  if(e.lines.ckd.status!=='stop') t += ckdT;
  if(e.lines.se206.status!=='stop') t += se206T;
  if(e.lines.darpoosh.status!=='stop') t += darpooshT;
  if(e.lines.diesel.status!=='stop') t += dieselT;
  return t;
}

/* GSHEET: if configured (via Settings, or hard-coded below), all reads/writes
   go through your own Google Sheet (via the Apps Script Web App provided
   separately) instead of window.storage. This makes the dashboard work fully
   standalone — outside claude.ai — with data that lives in a sheet you own.
   To make this permanent (survives every reload, on every device/browser),
   fill in the two values below after you deploy the Apps Script: */
let GSHEET = { url: 'https://script.google.com/macros/s/AKfycbztC8XtTcXoWxrbvufjSbh5WLGa4VqYNjN3n8O_MCxfruWeoKWepW3bm6b2thNX5E-w/exec', token: 'Aa@123456' }; // <-- hard-coded: همه‌ی پرسنل با باز کردن همین فایل به یک Google Sheet مشترک وصل می‌شوند
function hasCloudBackend(){ return !!GSHEET.url || (typeof window.storage !== 'undefined'); }
let lastSyncError = null; // rich diagnostic info about the most recent failure — shown in the sync modal
function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }
/* Google Sheets caps a single cell at 50,000 characters. A busy production
   line's waste/trash log can easily out-grow that on its own — writing it
   as one cell was silently failing the ENTIRE save. Everything below
   transparently splits any oversized value into multiple cells ("__c0",
   "__c1", ...) and reassembles them on read. */
const GS_CHUNK_LIMIT = 40000; // chars per cell — safely under Sheets' 50,000 limit

/* Fetches from the Apps Script URL and always returns parsed JSON (or throws
   with a clear, categorized reason). Also records lastSyncError so the sync
   modal can show real diagnostics instead of a generic "failed" message. */
async function gsFetch(url, options, label){
  let res;
  try{
    res = await fetch(url, options);
  }catch(networkErr){
    lastSyncError = { when: new Date().toISOString(), action: label, message: 'خطای شبکه — به آدرس Web App نمی‌رسیم (' + String(networkErr).slice(0,150) + ')' };
    throw networkErr;
  }
  const text = await res.text();
  let data;
  try{ data = JSON.parse(text); }
  catch(parseErr){
    const looksHtml = /<html|<!DOCTYPE/i.test(text);
    lastSyncError = {
      when: new Date().toISOString(), action: label, status: res.status,
      bodySnippet: text.slice(0,300),
      message: looksHtml
        ? 'پاسخ سرور HTML بود نه JSON — معمولاً یعنی گوگل صفحه ورود/دسترسی نشون داده، نه خود اسکریپت. Deploy را دوباره چک کنید (Who has access: Anyone).'
        : 'پاسخ سرور قابل خواندن نبود (نه JSON معتبر).'
    };
    throw new Error('non-JSON response, status ' + res.status);
  }
  if(data.error){
    lastSyncError = { when: new Date().toISOString(), action: label, status: res.status, message: data.error };
  }
  return data;
}
/* Retries a gsFetch call up to 2 extra times with backoff — smooths over
   Apps Script cold-starts (can take 5-8s) and transient lock contention
   ("server busy") instead of failing on the very first hiccup. */
async function gsFetchRetry(url, options, label){
  const delays = [0, 900, 2000];
  let lastErr;
  for(let i=0;i<delays.length;i++){
    if(delays[i]) await sleep(delays[i]);
    try{
      const data = await gsFetch(url, options, label);
      if(data.error === 'server busy, try again' && i < delays.length-1) continue;
      return data;
    }catch(e){ lastErr = e; }
  }
  throw lastErr;
}

/* ---- raw layer: moves plain strings in/out of the backend, no JSON logic ---- */
async function rawBatchGet(keys){
  if(GSHEET.url){
    try{
      const data = await gsFetchRetry(GSHEET.url + '?action=batchGet&token=' + encodeURIComponent(GSHEET.token) + '&keys=' + encodeURIComponent(JSON.stringify(keys)), undefined, 'batchGet');
      if(data.error === 'unknown action: batchGet') return await rawBatchGetFallback(keys);
      if(data.error){ console.warn('GSheet batchGet error:', data.error); return {}; }
      const out = {};
      keys.forEach(k=>{ out[k] = data.values ? (data.values[k] ?? null) : null; });
      return out;
    }catch(e){ console.warn('GSheet batchGet failed:', e); return await rawBatchGetFallback(keys); }
  }
  return await rawBatchGetFallback(keys);
}
async function rawBatchGetFallback(keys){
  const out = {};
  await Promise.all(keys.map(async k=>{
    if(GSHEET.url){
      try{
        const data = await gsFetchRetry(GSHEET.url + '?action=get&token=' + encodeURIComponent(GSHEET.token) + '&key=' + encodeURIComponent(k), undefined, 'get:'+k);
        out[k] = data.error ? null : (data.value ?? null);
      }catch(e){ out[k] = null; }
    } else {
      try{ const r = await window.storage.get(k, false); out[k] = r ? r.value : null; }catch(e){ out[k] = null; }
    }
  }));
  return out;
}
async function rawBatchSet(rawItems){
  const keys = Object.keys(rawItems);
  if(!keys.length) return true;
  if(GSHEET.url){
    try{
      const items = keys.map(k=>({ key:k, value: rawItems[k] }));
      const data = await gsFetchRetry(GSHEET.url, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'}, // avoids CORS preflight against Apps Script
        body: JSON.stringify({ token: GSHEET.token, action:'batchSet', items })
      }, 'batchSet');
      if(data.error === 'unknown action: batchSet') return await rawBatchSetFallback(rawItems);
      if(data.error){ console.warn('GSheet batchSet error:', data.error); return false; }
      return true;
    }catch(e){ console.warn('GSheet batchSet failed:', e); return await rawBatchSetFallback(rawItems); }
  }
  return await rawBatchSetFallback(rawItems);
}
async function rawBatchSetFallback(rawItems){
  const results = await Promise.all(Object.keys(rawItems).map(async k=>{
    if(GSHEET.url){
      try{
        const data = await gsFetchRetry(GSHEET.url, {
          method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
          body: JSON.stringify({ token: GSHEET.token, key:k, value: rawItems[k] })
        }, 'set:'+k);
        return !data.error;
      }catch(e){ return false; }
    }
    try{ const r = await window.storage.set(k, rawItems[k], false); return !!r; }catch(e){ return false; }
  }));
  return results.every(Boolean);
}

/* ---- app layer: JSON encode/decode + transparent chunking on top of raw ---- */
async function decodeValue(key, raw){
  if(raw===null || raw===undefined || raw==='') return null;
  let parsed;
  try{ parsed = JSON.parse(raw); }catch(e){ return null; }
  if(parsed && typeof parsed==='object' && parsed.__chunked){
    const chunkKeys = Array.from({length: parsed.count}, (_,i)=> key+'__c'+i);
    const rawChunks = await rawBatchGet(chunkKeys);
    let full = '';
    for(let i=0;i<parsed.count;i++){ full += (rawChunks[key+'__c'+i] || ''); }
    try{ return JSON.parse(full); }catch(e){ return null; }
  }
  return parsed;
}
async function cloudGet(key){
  const raw = (await rawBatchGet([key]))[key];
  return await decodeValue(key, raw);
}
async function cloudSet(key, value){
  return await cloudBatchSet({ [key]: value });
}
async function cloudBatchGet(keys){
  const rawMap = await rawBatchGet(keys);
  const out = {};
  for(const k of keys){ out[k] = await decodeValue(k, rawMap[k]); }
  return out;
}
async function cloudBatchSet(pairs){
  const rawItems = {};
  for(const key of Object.keys(pairs)){
    const jsonStr = JSON.stringify(pairs[key]);
    if(jsonStr.length > GS_CHUNK_LIMIT){
      const chunks = [];
      for(let i=0;i<jsonStr.length;i+=GS_CHUNK_LIMIT) chunks.push(jsonStr.slice(i, i+GS_CHUNK_LIMIT));
      chunks.forEach((c,i)=>{ rawItems[key+'__c'+i] = c; });
      rawItems[key] = JSON.stringify({ __chunked:true, count:chunks.length });
    } else {
      rawItems[key] = jsonStr;
    }
  }
  return await rawBatchSet(rawItems);
}
function lineKey(lineId, part){ return 'tmst_line_' + lineId + '_' + part; }

async function saveAll(silent){

  pairs[lineKey(currentLineId,'daily')] = DB.daily;

  pairs[lineKey(currentLineId,'meta')] = DB.meta;
  pairs[lineKey(currentLineId,'trash')] = DB.trash;
  pairs[lineKey(currentLineId,'stationHourly')] = DB.stationHourly;
  const allOk = await cloudBatchSet(pairs);
  if(allOk){ lastSavedAt = new Date(); setSync('ok', (GSHEET.url? 'متصل به گوگل‌شیت — ذخیره شد' : 'متصل به فضای ابری — ذخیره شد')); if(!silent) toast('اطلاعات با موفقیت ذخیره شد.','ok'); }

/* Applies restrained, purposeful value labels per chart — never on every point of
   a busy line chart (that's clutter), only where a number actually helps at a glance:
   the current/last point of a trend, the top of a bar (when there aren't too many),
   and meaningful slices of a donut. Callers can opt a dataset out with `noLabel:true`
   or supply a custom `labelFmt(value)` formatter. */
function autoDataLabels(config){
  if(typeof ChartDataLabels === 'undefined') return;
  const gtype = config.type;
  (config.data.datasets||[]).forEach(ds=>{
    if(ds.noLabel){ ds.datalabels = {display:false}; return; }
    const dtype = ds.type || gtype;
    const n = (ds.data||[]).length;
    const fmtNum = ds.labelFmt || (v => fmt(v, ds.labelDigits ?? 0));
    if(dtype==='line'){
      ds.datalabels = {
        display: (ctx)=> ctx.dataIndex === ctx.dataset.data.length-1,
        align:'top', anchor:'end', offset:6, clamp:true,
        backgroundColor: 'rgba(12,18,32,.82)', borderRadius:5, padding:{top:2,bottom:2,left:5,right:5},
        color: ds.borderColor || '#cfe0ff', font:{ size:10.5, weight:'700', family:'Vazirmatn' },
        formatter:(v)=> (v===null||v===undefined)?'':fmtNum(v)
      };
    } else if(dtype==='bar'){
      ds.datalabels = {
        display: (ctx)=> (ds.forceLabels || n<=16) && ctx.dataset.data[ctx.dataIndex],
        anchor:'end', align: gtype==='bar' && config.options?.indexAxis==='y' ? 'end' : 'end',
        offset:2, color:'#c9d4e8', font:{ size: ds.forceLabels ? 8.5 : 9.5, weight:'700', family:'Vazirmatn' },
        formatter:(v)=> (v===null||v===undefined||v===0)?'':fmtNum(v)
      };
    } else if(dtype==='doughnut' || dtype==='pie'){
      ds.datalabels = {
        color:'#0c1220', font:{ size:10.5, weight:'800', family:'Vazirmatn' },
        formatter:(v)=>{
          const arr = ds.data||[]; const total = arr.reduce((a,b)=>a+(b||0),0);
          const p = total? v/total : 0;
          return p>=0.06 ? Math.round(p*100)+'٪' : '';
        }
      };
    }
  });
}
function destroyCharts(){ Object.values(charts).forEach(c=>{ try{c.destroy();}catch(e){} }); charts = {}; }
function mkChart(id, config){
  const ctx = document.getElementById(id); if(!ctx) return;
  if(typeof Chart === 'undefined'){
    // chart library not ready yet (slow/blocked CDN) - retry shortly instead of crashing the app
    const wrap = ctx.closest('.chart-box');
    if(wrap && !wrap.dataset.retry){
      wrap.dataset.retry = '1';
      setTimeout(()=>{ if(typeof Chart !== 'undefined'){ mkChart(id, config); } else if(wrap){ wrap.innerHTML = '<div class="tbl-empty">نمودار در دسترس نیست (بارگذاری کتابخانه نمودار ناموفق بود).</div>'; } }, 700);
    }
    return;
  }
  if(typeof ChartDataLabels !== 'undefined' && !Chart.__dlRegistered){ Chart.register(ChartDataLabels); Chart.__dlRegistered = true; }
  autoDataLabels(config);
  try{ charts[id] = new Chart(ctx, config); }catch(e){ console.warn('chart error', id, e); }
}

    confirmDeleteModal('حذف ردیف', 'این روز حذف می‌شود؛ می‌توانید بعداً از «سطل بازیابی» (بالای صفحه) آن را برگردانید.', ()=>{
      const rec = DB.daily.find(x=>x.id===b.dataset.del);
      DB.daily = DB.daily.filter(x=>x.id!==b.dataset.del);
      if(rec) moveToTrash('daily', rec);
      scheduleSave(); renderEntry(); toast('ردیف حذف شد — از سطل بازیابی قابل بازگشت است.','ok');
    });
  }));
  document.getElementById('expDailyCsv').addEventListener('click', ()=>{
    const headers = ['تاریخ','روز','خط1','خط2','خط3','خط4','CKD','سه‌راهی206','درپوش','دیزل/بنز','جمع4خط','جمع کل','جمع ارسال'];
    const rows = M.daily.map(e=>[e.date,e.day,
      e.lines.line1.status==='stop'?'توقف':e.lines.line1.qty, e.lines.line2.status==='stop'?'توقف':e.lines.line2.qty,
      e.lines.line3.status==='stop'?'توقف':e.lines.line3.qty, e.lines.line4.status==='stop'?'توقف':e.lines.line4.qty,
      e.lines.ckd.status==='stop'?'توقف':e.lines.ckd.qty, e.lines.se206.status==='stop'?'توقف':e.lines.se206.qty, e.lines.darpoosh.status==='stop'?'توقف':e.lines.darpoosh.qty,
      e.lines.diesel.status==='stop'?'توقف':e.lines.diesel.qty,
      mainFourTotal(e), allLinesTotal(e), shipTotal(e)]);
    downloadFile('ورود-داده-روزانه.csv', toCSV(headers, rows), 'text/csv;charset=utf-8');
  });
}

/* =========================================================================

function emptyStationHourlyDraft(){
  return { id:null, date:'', stationId: ((DB.meta.stations||[])[0]||{}).id || '', total:null, operator:'', traceId:'', inspectionId:'', shiftStart:'', shiftEnd:'', product:'' };
}
function renderStations(){
  const M = monthData();
  const stations = DB.meta.stations || [];
  const draft = editing.stationHourly || emptyStationHourlyDraft();
  const filterStation = filters.stationFilter || 'all';
  const list = [...M.stationHourly].sort((a,b)=>dateSortKey(b.date)-dateSortKey(a.date))
    .filter(r=> filterStation==='all' || r.stationId===filterStation);

  // KPIs
  const withTarget = M.stationHourly.filter(r=> r.target>0);
  const avgDevPct = withTarget.length ? withTarget.reduce((s,r)=> s + (r.total-r.target)/r.target, 0) / withTarget.length : null;
  const byStationDev = {};
  stations.forEach(st=>{
    const recs = M.stationHourly.filter(r=>r.stationId===st.id && r.target>0);
    if(!recs.length) return;
    const sumActual = recs.reduce((s,r)=>s+r.total,0);
    const sumTarget = recs.reduce((s,r)=>s+r.target,0);
    byStationDev[st.id] = { name: st.name, dev: sumTarget? (sumActual-sumTarget)/sumTarget : 0, actual: sumActual, target: sumTarget };
  });
  const sortedDev = Object.values(byStationDev).sort((a,b)=>a.dev-b.dev);
  const worstStation = sortedDev[0];
  const bestStation = sortedDev[sortedDev.length-1];

  const html = renderMonthBar() + `
  <div class="grid grid-4" style="margin-bottom:16px;">
    ${kpiCard('ثبت‌های این ماه','ردیف', fmt(M.stationHourly.length,0), null, '#4c8dff')}
    ${kpiCard('میانگین انحراف از استاندارد','', avgDevPct===null?'—':pct(avgDevPct,1), avgDevPct>=0?'up':'down', avgDevPct>=0?'#2fd9c4':'#ff5d6c')}
    ${kpiCard('ضعیف‌ترین ایستگاه (این ماه)', '', worstStation? esc(worstStation.name):'—', null, '#ff5d6c', true)}
    ${kpiCard('بهترین ایستگاه (این ماه)', '', bestStation? esc(bestStation.name):'—', null, '#2fd9c4', true)}
  </div>

  <div class="card" style="margin-bottom:16px;">
    <h3>⚙️ ستاپ ایستگاه‌ها <span class="muted">استاندارد ساعتی (مرجع) و هدف روزانه — مخصوص همین خط تولید</span></h3>
    <div class="table-wrap" style="margin-bottom:14px;"><table>
      <thead><tr><th>نام ایستگاه</th><th class="num">استاندارد ساعتی</th><th class="num">هدف روزانه</th><th>مرحله جریان</th><th></th></tr></thead>
      <tbody>
      ${stations.length===0? `<tr><td colspan="5"><div class="tbl-empty">هنوز ایستگاهی تعریف نشده — پایین همین کارت یک ایستگاه اضافه کنید.</div></td></tr>` :
      stations.map(st=>`<tr>
        <td>${esc(st.name)}</td><td class="num">${fmt(st.hourlyStandard,0)}</td><td class="num">${fmt(st.dailyTarget,0)}</td>
        <td>${st.stage?`<span class="tag" style="background:#1c2a44;color:#8fb2ff;padding:2px 9px;border-radius:10px;font-size:10.5px;">${esc(st.stage)}</span>`:'<span class="muted">—</span>'}</td>
        <td><div style="display:flex; gap:6px;">
          <button class="icon-btn" data-stedit="${st.id}" title="ویرایش ایستگاه"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>
          <button class="icon-btn" data-stdel="${st.id}" title="حذف ایستگاه"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg></button>
        </div></td>
      </tr>`).join('')}
      </tbody>
    </table></div>
    <div class="section-title"><span>${editing.station? '✏️ ویرایش ایستگاه: '+esc(editing.station.name) : '➕ افزودن ایستگاه جدید'}</span><span class="ln"></span></div>
    <div class="form-grid">
      <div class="field"><label>نام ایستگاه</label><input id="newStName" placeholder="مثلاً: پرچ سیلندر" value="${esc(editing.station?.name||'')}"></div>
      <div class="field"><label>استاندارد ساعتی</label><input id="newStHourly" type="text" inputmode="numeric" placeholder="مثلاً: 850" value="${editing.station?.hourlyStandard ?? ''}"></div>
      <div class="field"><label>هدف روزانه</label><input id="newStDaily" type="text" inputmode="numeric" placeholder="مثلاً: 8650" value="${editing.station?.dailyTarget ?? ''}"></div>
      <div class="field"><label>مرحله جریان <span class="muted">(اختیاری)</span></label>
        <input id="newStStage" list="stageNameList" placeholder="مثلاً: اتاق قرص" value="${esc(editing.station?.stage||'')}">
        <datalist id="stageNameList">${[...new Set((DB.meta.stations||[]).map(s=>s.stage).filter(Boolean))].map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
      </div>
      <div class="field" style="display:flex; align-items:flex-end; gap:8px;">
        <button class="btn btn-teal" id="addStationBtn" style="flex:1;">${editing.station? 'ذخیره تغییرات':'افزودن ایستگاه'}</button>
        ${editing.station? '<button class="btn btn-ghost" id="cancelStationEditBtn">انصراف</button>':''}
      </div>
    </div>
    <div class="hint" style="margin-top:8px;">اگر چند ایستگاه سریالی با هم یک زیرخط (مثلاً «اتاق قرص») را می‌سازند و مجموعاً باید بیشتر از هدف نهایی خط تولید کنند (مثلاً برای پوشش ضایعات یا تغذیه چند خط)، همه را با یک نام «مرحله جریان» یکسان علامت بزنید — سپس در تب «نقشه خط و گلوگاه‌ها» می‌توانید هدف ورودی موردنیاز همان مرحله را جداگانه تعریف کنید.</div>
  </div>

  <div class="card" style="margin-bottom:18px;">
    <h3>${draft.id? '✏️ ویرایش آمار ایستگاه' : '➕ ثبت تولید روزانه ایستگاه'}</h3>
    ${stations.length===0? '<div class="tbl-empty">اول یک ایستگاه در بخش بالا تعریف کنید.</div>' : `
    <div class="form-grid">
      <div class="field"><label>تاریخ</label>${datePickerHtml('sh_date', draft.date)}</div>
      <div class="field"><label>ایستگاه</label><select id="sh_station">${stations.map(st=>`<option value="${st.id}" ${draft.stationId===st.id?'selected':''}>${esc(st.name)} (هدف: ${fmt(st.dailyTarget,0)})</option>`).join('')}</select></div>
      <div class="field"><label>تولید روز</label><input id="sh_total" type="text" inputmode="numeric" value="${draft.total ?? ''}" placeholder="0"></div>
      <div class="field"><label>هدف / انحراف</label><input id="sh_preview" readonly style="color:var(--text); font-weight:800;" value="—"></div>
      <div class="field"><label>اپراتور ۱</label><select id="sh_op0">${(()=>{ const sel=(draft.operator||'').split(/[،,]/).map(s=>s.trim()).filter(Boolean); const all=allOperatorNames(); return '<option value="">— انتخاب نشده —</option>'+all.map(n=>`<option value="${esc(n)}" ${sel[0]===n?'selected':''}>${esc(n)}</option>`).join(''); })()}</select></div>
      <div class="field"><label>اپراتور ۲</label><select id="sh_op1">${(()=>{ const sel=(draft.operator||'').split(/[،,]/).map(s=>s.trim()).filter(Boolean); const all=allOperatorNames(); return '<option value="">— انتخاب نشده —</option>'+all.map(n=>`<option value="${esc(n)}" ${sel[1]===n?'selected':''}>${esc(n)}</option>`).join(''); })()}</select></div>
      <div class="field"><label>اپراتور ۳</label><select id="sh_op2">${(()=>{ const sel=(draft.operator||'').split(/[،,]/).map(s=>s.trim()).filter(Boolean); const all=allOperatorNames(); return '<option value="">— انتخاب نشده —</option>'+all.map(n=>`<option value="${esc(n)}" ${sel[2]===n?'selected':''}>${esc(n)}</option>`).join(''); })()}</select></div>
      <div class="field"><label>ساعت شروع</label>${timePickerHtml('sh_shiftStart', draft.shiftStart)}</div>
      <div class="field"><label>ساعت پایان</label>${timePickerHtml('sh_shiftEnd', draft.shiftEnd)}</div>
      <div class="field"><label>محصول/قطعه</label><select id="sh_product"><option value="">— انتخاب —</option>${FINAL_PRODUCT_LIST_DEFAULT.map(o=>`<option value="${esc(o)}" ${draft.product===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>
      <div class="field"><label>شماره شناسایی ردیابی <span class="muted">(اختیاری)</span></label><input id="sh_traceId" placeholder="مثلاً کد بچ/لات" value="${esc(draft.traceId||'')}"></div>
      <div class="field"><label>شماره بازرسی <span class="muted">(اختیاری)</span></label><input id="sh_inspectionId" placeholder="مثلاً کد بازرسی کیفیت" value="${esc(draft.inspectionId||'')}"></div>
    </div>
    <div class="modal-actions" style="justify-content:flex-start; margin-top:16px;">
      <button class="btn btn-primary" id="saveStHourlyBtn">${draft.id?'ذخیره تغییرات':'ثبت آمار روز'}</button>
      ${draft.id?'<button class="btn btn-ghost" id="cancelStHourlyBtn">انصراف</button>':''}
      ${syncButtonHtml('syncBtn_stations')}
    </div>`}
  </div>

  <div class="grid grid-2" style="margin-bottom:16px;">
    <div class="card"><h3>روند روزانه در برابر استاندارد ${filterStation!=='all'? '— '+esc((stationById(filterStation)||{}).name||''):'(همه ایستگاه‌ها)'}</h3><div class="chart-box"><canvas id="chStTrend"></canvas></div></div>
    <div class="card"><h3>مقایسه انحراف ایستگاه‌ها از استاندارد (این ماه)</h3><div class="chart-box"><canvas id="chStCompare"></canvas></div></div>
  </div>

  <div class="card">
    <div class="flexbar">
      <h3 style="margin:0;">ثبت‌های آمار ایستگاه‌ها (${list.length} از ${M.stationHourly.length})</h3>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <select id="stFilterSelect" class="pill" style="padding:7px 10px;">
          <option value="all" ${filterStation==='all'?'selected':''}>همه ایستگاه‌ها</option>
          ${stations.map(st=>`<option value="${st.id}" ${filterStation===st.id?'selected':''}>${esc(st.name)}</option>`).join('')}
        </select>
        <button class="btn btn-ghost btn-sm" id="expStCsv">خروجی CSV</button>
      </div>
    </div>
    <div class="table-wrap" style="max-height:460px; overflow:auto;"><table>
      <thead><tr><th>تاریخ</th><th>ایستگاه</th><th>اپراتور(ها)</th><th>ساعت</th><th>محصول/قطعه</th><th class="num">تولید</th><th class="num">هدف</th><th class="num">انحراف٪</th><th></th></tr></thead>
      <tbody>
      ${list.length===0?`<tr><td colspan="9"><div class="tbl-empty">موردی یافت نشد.</div></td></tr>`:
      list.map(r=>{
        const devp = r.target? (r.total-r.target)/r.target : null;
        const shiftRange = (r.shiftStart||r.shiftEnd) ? `${esc(r.shiftStart)||'—'}–${esc(r.shiftEnd)||'—'}` : '—';
        return `<tr><td>${esc(r.date)}</td><td>${esc((stationById(r.stationId)||{}).name||'—')}</td><td>${esc(r.operator)||'—'}</td>
          <td style="direction:ltr; text-align:center;">${shiftRange}</td><td>${esc(r.product)||'—'}</td>
          <td class="num"><b>${fmt(r.total,0)}</b></td><td class="num">${fmt(r.target,0)}</td>
          <td class="num" style="color:${devp===null?'inherit':devp>=0?'#8ff0c8':'#ffb0b8'}">${devp===null?'—':pct(devp,1)}</td>
          <td><div style="display:flex; gap:6px;">
            <button class="icon-btn" data-shedit="${r.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>
            <button class="icon-btn" data-shdel="${r.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg></button>
          </div></td></tr>`;
      }).join('')}
      </tbody>
    </table></div>
  </div>`;

  document.getElementById('view').innerHTML = html;
  bindMonthBar(()=>renderStations());
  wireSyncBtn('syncBtn_stations');

  document.getElementById('addStationBtn').addEventListener('click', ()=>{
    const name = document.getElementById('newStName').value.trim();
    const hourly = num(document.getElementById('newStHourly').value);
    const daily = num(document.getElementById('newStDaily').value);
    const stage = document.getElementById('newStStage').value.trim();
    if(!name){ toast('نام ایستگاه را وارد کنید.','err'); return; }
    DB.meta.stations = DB.meta.stations || [];
    if(editing.station){
      const st = DB.meta.stations.find(s=>s.id===editing.station.id);
      if(st){ st.name = name; st.hourlyStandard = hourly||0; st.dailyTarget = daily || (hourly? hourly*10 : 0); st.stage = stage||''; }
      // keep target/name in any already-saved daily records referencing this station in sync
      (DB.stationHourly||[]).forEach(r=>{ if(r.stationId===editing.station.id) r.target = st.dailyTarget; });
      editing.station = null;
      scheduleSave(); toast('ایستگاه ویرایش شد.','ok'); renderStations();
    } else {
      DB.meta.stations.push({ id: uid(), name, hourlyStandard: hourly||0, dailyTarget: daily || (hourly? hourly*10 : 0), stage: stage||'' });
      scheduleSave(); toast('ایستگاه اضافه شد.','ok'); renderStations();
    }
  });
  const cancelStEditBtn = document.getElementById('cancelStationEditBtn');
  if(cancelStEditBtn) cancelStEditBtn.addEventListener('click', ()=>{ editing.station = null; renderStations(); });
  document.querySelectorAll('[data-stedit]').forEach(b=>b.addEventListener('click', ()=>{
    editing.station = JSON.parse(JSON.stringify((DB.meta.stations||[]).find(s=>s.id===b.dataset.stedit)));
    renderStations(); window.scrollTo({top:0, behavior:'smooth'});
  }));
  document.querySelectorAll('[data-stdel]').forEach(b=>b.addEventListener('click', ()=>{
    confirmDeleteModal('حذف ایستگاه', 'این ایستگاه از لیست حذف می‌شود؛ ثبت‌های قبلی آن در جدول باقی می‌مانند اما نام ایستگاه دیگر نشان داده نخواهد شد.', ()=>{
      DB.meta.stations = DB.meta.stations.filter(s=>s.id!==b.dataset.stdel);
      if(editing.station && editing.station.id===b.dataset.stdel) editing.station = null;
      scheduleSave(); toast('ایستگاه حذف شد.','ok'); renderStations();
    });
  }));

  if(stations.length){
    const stEl = document.getElementById('sh_station');
    const totalEl = document.getElementById('sh_total');
    const previewEl = document.getElementById('sh_preview');
    const updatePreview = ()=>{
      const st = stationById(stEl.value);
      const sum = num(totalEl.value)||0;
      const hoursWorked = hoursBetweenTimes(readTimePicker('sh_shiftStart'), readTimePicker('sh_shiftEnd'));
      const target = proratedStationTarget(st, hoursWorked);
      const dev = target ? (sum-target)/target : null;
      previewEl.value = fmt(target,0) + (hoursWorked? '  («'+fmt(hoursWorked,1)+' ساعت کاری»)' : '  (هدف کامل روزانه — ساعت کاری وارد نشده)') + (dev===null? '' : '  ' + pct(dev,1));
      previewEl.style.color = dev===null ? 'var(--text)' : (dev>=0? '#8ff0c8':'#ffb0b8');
    };
    totalEl.addEventListener('input', updatePreview);
    stEl.addEventListener('change', updatePreview);
    ['sh_shiftStart_h','sh_shiftStart_m','sh_shiftEnd_h','sh_shiftEnd_m'].forEach(id=>{
      const el = document.getElementById(id); if(el) el.addEventListener('change', updatePreview);
    });
    updatePreview();

    document.getElementById('saveStHourlyBtn').addEventListener('click', ()=>{
      const date = readDatePicker('sh_date');
      const stationId = stEl.value;
      const total = num(totalEl.value);
      if(!date || !stationId || total===null){ toast('تاریخ، ایستگاه و مقدار تولید الزامی است.','err'); return; }
      const st = stationById(stationId);
      const opNames = [document.getElementById('sh_op0').value, document.getElementById('sh_op1').value, document.getElementById('sh_op2').value].filter(Boolean);
      const shiftStart = readTimePicker('sh_shiftStart'), shiftEnd = readTimePicker('sh_shiftEnd');
      const hoursWorked = hoursBetweenTimes(shiftStart, shiftEnd);
      const rec = { id: draft.id || uid(), date, stationId, total, target: proratedStationTarget(st, hoursWorked), operator: [...new Set(opNames)].join('، '),
        shiftStart, shiftEnd, product: document.getElementById('sh_product').value,
        traceId: document.getElementById('sh_traceId').value.trim(), inspectionId: document.getElementById('sh_inspectionId').value.trim() };
      if(draft.id){ DB.stationHourly = DB.stationHourly.map(x=>x.id===draft.id?rec:x); toast('ویرایش شد.','ok'); }
      else{ DB.stationHourly.push(rec); toast('آمار روزانه ثبت شد.','ok'); }
      editing.stationHourly = null; scheduleSave(); renderStations();
    });
    const cancelBtn = document.getElementById('cancelStHourlyBtn');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ editing.stationHourly=null; renderStations(); });
  }

  document.querySelectorAll('[data-shedit]').forEach(b=>b.addEventListener('click', ()=>{
    editing.stationHourly = JSON.parse(JSON.stringify(DB.stationHourly.find(x=>x.id===b.dataset.shedit)));
    renderStations(); window.scrollTo({top:0, behavior:'smooth'});
  }));
  document.querySelectorAll('[data-shdel]').forEach(b=>b.addEventListener('click', ()=>{
    confirmDeleteModal('حذف آمار ایستگاه', 'این ردیف حذف می‌شود؛ می‌توانید بعداً از «سطل بازیابی» آن را برگردانید.', ()=>{
      const rec = DB.stationHourly.find(x=>x.id===b.dataset.shdel);
      DB.stationHourly = DB.stationHourly.filter(x=>x.id!==b.dataset.shdel);
      if(rec) moveToTrash('stationHourly', rec);
      scheduleSave(); renderStations(); toast('حذف شد — از سطل بازیابی قابل بازگشت است.','ok');
    });
  }));
  document.getElementById('stFilterSelect').addEventListener('change', e=>{ filters.stationFilter = e.target.value; renderStations(); });
  document.getElementById('expStCsv').addEventListener('click', ()=>{
    const headers = ['تاریخ','ایستگاه','اپراتور(ها)','ساعت شروع','ساعت پایان','محصول/قطعه','تولید','هدف','انحراف','شماره شناسایی ردیابی','شماره بازرسی'];
    const rr = M.stationHourly.map(r=>[r.date, (stationById(r.stationId)||{}).name||'', r.operator||'', r.shiftStart||'', r.shiftEnd||'', r.product||'', r.total, r.target, r.target? (r.total-r.target):'', r.traceId||'', r.inspectionId||'']);
    downloadFile('آمار-ایستگاه‌ها.csv', toCSV(headers, rr), 'text/csv;charset=utf-8');
  });

  // charts
  const trendRows = [...M.stationHourly].filter(r=> filterStation==='all' || r.stationId===filterStation).sort((a,b)=>dateSortKey(a.date)-dateSortKey(b.date));
  const trendByDate = {};
  trendRows.forEach(r=>{ if(!trendByDate[r.date]) trendByDate[r.date] = {actual:0, target:0}; trendByDate[r.date].actual += r.total; trendByDate[r.date].target += r.target; });
  const trendDates = Object.keys(trendByDate).sort((a,b)=>dateSortKey(a)-dateSortKey(b));
  mkChart('chStTrend', { type:'line', data:{ labels: trendDates, datasets:[
      {label:'تولید واقعی', data: trendDates.map(d=>trendByDate[d].actual), borderColor:'#ff9d42', backgroundColor:'rgba(255,157,66,.15)', fill:true, tension:.35, pointRadius:3},
      {label:'استاندارد', data: trendDates.map(d=>trendByDate[d].target), borderColor:'#4c8dff', borderDash:[6,5], pointRadius:0, noLabel:true}
    ]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{boxWidth:10,padding:14}}}, scales:{x:{grid:{color:'#182338'}}, y:{grid:{color:'#182338'}}} } });

  const compareArr = Object.values(byStationDev).sort((a,b)=>a.dev-b.dev);
  mkChart('chStCompare', { type:'bar', data:{ labels: compareArr.map(x=>x.name), datasets:[{label:'انحراف از استاندارد', data: compareArr.map(x=>x.dev*100), backgroundColor: compareArr.map(x=>x.dev>=0?'#2fd9c4':'#ff5d6c'), borderRadius:6, maxBarThickness:26, labelFmt:v=>Math.round(v)+'٪'}]},
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:(ctx)=> ctx.parsed.x.toFixed(1)+'٪'}}}, scales:{x:{grid:{color:'#182338'}, ticks:{callback:v=>v+'٪'}}, y:{grid:{display:false}, ticks:{font:{size:11}}}} } });
}
function renderProd(){
  const rows = [...monthData().daily].sort((a,b)=>dateSortKey(a.date)-dateSortKey(b.date));
  const target = DB.meta.lineTarget || LINE_TARGET_DEFAULT;
  const ckdTarget = DB.meta.ckdTarget || 0;
  const se206Target = DB.meta.se206Target || 0;
  const darpooshTarget = DB.meta.darpooshTarget || 0;
  const dieselTarget = DB.meta.dieselTarget || DIESEL_TARGET_DEFAULT;
  const sum4 = rows.reduce((s,e)=>s+mainFourTotal(e),0);
  const sumAll = rows.reduce((s,e)=>s+allLinesTotal(e),0);
  const targetTotal = rows.reduce((s,e)=>s+dayTarget4Lines(e),0);
  const combinedTargetTotal = rows.reduce((s,e)=>s+dayCombinedTarget(e),0);
  const avgDevPct = combinedTargetTotal? (sumAll-combinedTargetTotal)/combinedTargetTotal : 0;
  const dailyTotals = rows.map(e=>mainFourTotal(e));
  const maxDay = rows.length? rows.reduce((a,b)=>mainFourTotal(a)>=mainFourTotal(b)?a:b) : null;
  const minDay = rows.length? rows.filter(e=>mainFourTotal(e)>0).reduce((a,b)=>(a&&mainFourTotal(a)<=mainFourTotal(b))?a:b, rows.find(e=>mainFourTotal(e)>0)) : null;
  const negDays = rows.filter(e=>allLinesTotal(e) - dayCombinedTarget(e) < 0 && allLinesTotal(e)>0).length;
  const itemStat = (key, dailyTarget)=>{
    const activeRows = rows.filter(e=> e.lines[key].status!=='stop');
    const sum = activeRows.reduce((s,e)=>s+(e.lines[key].qty||0),0);
    const goal = activeRows.reduce((s,e)=>s+dailyTarget*dayShiftFactor(e),0);
    const dev = goal? (sum-goal)/goal : null;
    return { sum, goal, dev, days: activeRows.length };
  };
  const ckdStat = itemStat('ckd', ckdTarget);
  const se206Stat = itemStat('se206', se206Target);
  const darpooshStat = itemStat('darpoosh', darpooshTarget);
  const dieselStat = itemStat('diesel', dieselTarget);

  // per-station average daily production vs. each station's own (variable) target — for the bullet chart below
  const stationRowsAll = monthData().stationHourly || [];
  const stationBullets = (DB.meta.stations||[]).map(st=>{
    const recs = stationRowsAll.filter(r=>r.stationId===st.id);
    if(!recs.length || !st.dailyTarget) return null;
    const avgActual = recs.reduce((s,r)=>s+(r.total||0),0) / recs.length;
    const ratio = avgActual / st.dailyTarget;
    return { name: st.name, actual: avgActual, target: st.dailyTarget, ratio, days: recs.length };
  }).filter(Boolean).sort((a,b)=>a.ratio-b.ratio);

  // 7 main categories, each with its own daily target — for the small-multiples trend grid
  const DAILY_STATION_DEFS = [
    {key:'line1', label:'خط ۱', target: target},
    {key:'line2', label:'خط ۲', target: target},
    {key:'line3', label:'خط ۳', target: target},
    {key:'line4', label:'خط ۴', target: target},
    {key:'ckd', label:'CKD', target: ckdTarget},
    {key:'se206', label:'سه‌راهی ۲۰۶', target: se206Target},
    {key:'darpoosh', label:'درپوش', target: darpooshTarget},
    {key:'diesel', label:'دیزل / بنز', target: dieselTarget},
  ];

  document.getElementById('view').innerHTML = renderMonthBar() + `
  <div class="grid grid-4" style="margin-bottom:16px;">
    ${kpiCard('جمع تولید ۴ خط اصلی','عدد', fmt(sum4,0), null, '#ff9d42')}
    ${kpiCard('جمع کل تولید (همه اقلام)','عدد', fmt(sumAll,0), null, '#4c8dff')}
    ${kpiCard('میانگین انحراف از هدف کل','', pct(avgDevPct,1), avgDevPct>=0?'up':'down', avgDevPct>=0?'#2fd9c4':'#ff5d6c')}
    ${kpiCard('روزهای با تولید کمتر از هدف کل','روز', fmt(negDays,0), null, '#ffcf5c')}
  </div>

  <div class="card" style="margin-bottom:16px;">
    <h3>ستاپ اهداف تولید روزانه این خط <span class="muted">هرکدام را متناسب با خط تولید خودتان تنظیم کنید</span></h3>
    <div class="form-grid">
      <div class="field"><label>هدف هر یک از ۴ خط اصلی</label><input id="targetInput" type="text" inputmode="numeric" value="${target}"></div>
      <div class="field"><label>حداکثر ظرفیت اسمی هر خط <span class="muted">(برای نرخ استفاده از ظرفیت)</span></label><input id="nominalCapInput" type="text" inputmode="numeric" value="${DB.meta.nominalCapacity || target}"></div>
      <div class="field"><label>هدف CKD (۰ = بدون هدف)</label><input id="ckdTargetInput" type="text" inputmode="numeric" value="${ckdTarget}"></div>
      <div class="field"><label>هدف سه‌راهی ۲۰۶ (۰ = بدون هدف)</label><input id="se206TargetInput" type="text" inputmode="numeric" value="${se206Target}"></div>
      <div class="field"><label>هدف درپوش (۰ = بدون هدف)</label><input id="darpooshTargetInput" type="text" inputmode="numeric" value="${darpooshTarget}"></div>
      <div class="field"><label>هدف دیزل / بنز <span class="muted">— خط پنجم، جدا از ۴ خط اصلی</span></label><input id="dieselTargetInput" type="text" inputmode="numeric" value="${dieselTarget}"></div>
      <div class="field"><label>ساعت شیفت «روز عادی» <span class="muted">(مبنای اهداف بالا)</span></label><input id="normalShiftInput" type="text" inputmode="numeric" value="${DB.meta.normalShiftHours||10}"></div>
      <div class="field"><label>بهای هر عدد ترموستات <span class="muted">(ریال — برای محاسبه ارزش ریالی توقف/ضایعات)</span></label><input id="unitCostInput" type="text" inputmode="numeric" placeholder="مثلاً 2000000" value="${DB.meta.unitCostRial||''}"></div>
    </div>
    <div class="hint" style="margin:10px 0 0;">هدف کل «۴ خط اصلی» = هدف هر خط × ۴ = <b>${fmt(target4Lines(),0)} عدد در روز</b>. دیزل/بنز، CKD، سه‌راهی۲۰۶ و درپوش خط‌های جداگانه‌اند و در این جمع حساب نمی‌شوند. «حداکثر ظرفیت اسمی» یعنی سقف تئوریک خط در حالت ایده‌آل (معمولاً کمی بالاتر از هدف) — نسبت این دو، «نرخ استفاده از ظرفیت» را در تب «شاخص‌های ناب» می‌سازد. «ساعت شیفت روز عادی» پایه‌ای است که همه اهداف بالا بر مبنای آن تعریف شده‌اند — وقتی در «ورود داده روزانه» یک روز را «تعطیل» علامت می‌زنید، هدف همان روز به‌نسبت این عدد خودکار کوچک می‌شود. «بهای هر عدد» اختیاری است — فقط اگر پر شود، ارزش ریالی توقف و ضایعات در «داشبورد مدیریتی» نشان داده می‌شود (یک برآورد ساده = تعداد از‌دست‌رفته × این عدد، نه یک محاسبه حسابداری دقیق هزینه).</div>
    <button class="btn btn-teal btn-sm" id="saveTargetBtn" style="margin-top:14px;">ذخیره اهداف</button>
  </div>

  <div class="grid grid-4" style="margin-bottom:16px;">
    ${ckdTarget>0? kpiCard('CKD — انحراف از هدف ماه', '', pct(ckdStat.dev,1), ckdStat.dev>=0?'up':'down', ckdStat.dev>=0?'#2fd9c4':'#ff5d6c') : kpiCard('جمع CKD این ماه','عدد', fmt(ckdStat.sum,0), null, '#4c8dff')}
    ${se206Target>0? kpiCard('سه‌راهی۲۰۶ — انحراف از هدف ماه', '', pct(se206Stat.dev,1), se206Stat.dev>=0?'up':'down', se206Stat.dev>=0?'#2fd9c4':'#ff5d6c') : kpiCard('جمع سه‌راهی۲۰۶ این ماه','عدد', fmt(se206Stat.sum,0), null, '#b389ff')}
    ${darpooshTarget>0? kpiCard('درپوش — انحراف از هدف ماه', '', pct(darpooshStat.dev,1), darpooshStat.dev>=0?'up':'down', darpooshStat.dev>=0?'#2fd9c4':'#ff5d6c') : kpiCard('جمع درپوش این ماه','عدد', fmt(darpooshStat.sum,0), null, '#ffcf5c')}
    ${dieselTarget>0? kpiCard('دیزل/بنز — انحراف از هدف ماه', '', pct(dieselStat.dev,1), dieselStat.dev>=0?'up':'down', dieselStat.dev>=0?'#2fd9c4':'#ff5d6c') : kpiCard('جمع دیزل/بنز این ماه','عدد', fmt(dieselStat.sum,0), null, '#ff9d8a')}
  </div>

  <div class="grid grid-2" style="margin-bottom:16px;">
    <div class="card"><h3>روند تولید روزانه در برابر هدف <span class="muted">جمع همه ۸ ردیف (۴ خط اصلی + CKD + سه‌راهی۲۰۶ + درپوش + دیزل/بنز)</span></h3><div class="chart-box"><canvas id="chProdTrend"></canvas></div></div>
    <div class="card"><h3>جمع تولید هر خط در بازه گزارش</h3><div class="chart-box"><canvas id="chProdByLine"></canvas></div></div>

  <div class="card" style="margin-bottom:16px;">
    <h3>روند روزانه ۸ ایستگاه اصلی <span class="muted">هرکدام با هدف روزانه مخصوص به خودش</span></h3>

    <div class="grid grid-4" id="dailyStationGrid" style="gap:14px;">
      ${DAILY_STATION_DEFS.map(d=>`<div class="mini-chart-card"><div class="mini-title">${d.label}<span class="muted"> — هدف ${fmt(d.target,0)}</span></div><div class="chart-box" style="height:170px;"><canvas id="chDaily_${d.key}"></canvas></div></div>`).join('')}
    </div>
  </div>

  <div class="card" style="margin-bottom:16px;">
    <h3>🎯 تولید روزانه ایستگاه‌ها نسبت به هدف <span class="muted">میانگین این ماه — هر ایستگاه با هدف خودش مقایسه می‌شود</span></h3>
    ${stationBullets.length===0? `<div class="tbl-empty">داده‌ای برای مقایسه نیست — از تب «آمار روزانه ایستگاه‌ها» تولید ایستگاه‌ها را ثبت کنید (باید برای ایستگاه هم هدف روزانه تعیین شده باشد).</div>` :
    `<div style="display:flex; flex-direction:column; gap:14px;">
      ${stationBullets.map(sb=>{
        const capRatio = 1.3; // visual headroom so over-target stations don't just slam into the wall
        const fillFrac = Math.min(sb.ratio, capRatio) / capRatio;
        const targetFrac = 1 / capRatio;
        const over = sb.ratio >= 1;
        const barColor = over ? 'linear-gradient(90deg,#1fae9b,#2fd9c4)' : (sb.ratio>=0.85 ? 'linear-gradient(90deg,#c98a2e,#ffcf5c)' : 'linear-gradient(90deg,#c73f4d,#ff5d6c)');
        return `<div>
          <div style="display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:5px;">
            <span style="font-size:12.5px; font-weight:700; color:var(--text);">${esc(sb.name)}</span>
            <span style="font-size:11.5px; color:var(--text-mute); direction:ltr;">${fmt(sb.actual,0)} <span style="color:var(--text-mute);">/</span> ${fmt(sb.target,0)} &nbsp;·&nbsp; <b style="color:${over?'#8ff0c8':'#ffb0b8'};">${pct(sb.ratio-1,0)}</b></span>
          </div>
          <div style="position:relative; height:14px; border-radius:7px; background:#141d31; border:1px solid var(--panel-border); overflow:hidden;">
            <div style="position:absolute; inset-inline-start:0; top:0; bottom:0; width:${(fillFrac*100).toFixed(1)}%; background:${barColor}; border-radius:7px; transition:width .4s;"></div>
            <div style="position:absolute; inset-inline-start:${(targetFrac*100).toFixed(1)}%; top:-2px; bottom:-2px; width:2px; background:#eef2f9; opacity:.85;" title="هدف"></div>
          </div>
        </div>`;
      }).join('')}
    </div>
    <div class="legend-row" style="margin-top:14px;">
      <span class="legend-dot"><i style="background:linear-gradient(90deg,#1fae9b,#2fd9c4);"></i> به هدف رسیده</span>
      <span class="legend-dot"><i style="background:linear-gradient(90deg,#c98a2e,#ffcf5c);"></i> نزدیک هدف (۸۵٪+)</span>
      <span class="legend-dot"><i style="background:linear-gradient(90deg,#c73f4d,#ff5d6c);"></i> فاصله زیاد از هدف</span>
      <span class="legend-dot"><i style="background:#eef2f9; width:2px; border-radius:0;"></i> خط هدف هر ایستگاه</span>
    </div>`}
  </div>

  <div class="card" style="margin-bottom:16px;">
    <div class="flexbar"><h3 style="margin:0;">بهترین و ضعیف‌ترین روز تولید</h3></div>
    <div class="grid grid-2">
      <div class="strip-card" style="min-width:0;">
        <div class="l">بیشترین تولید یک‌روزه (۴ خط اصلی)</div>
        <div class="v" style="color:#8ff0c8;">${maxDay? fmt(mainFourTotal(maxDay),0):'—'}</div>
        <div class="hint" style="margin-top:6px;">${maxDay? esc(maxDay.date)+' — '+esc(maxDay.day):''}</div>
      </div>
      <div class="strip-card" style="min-width:0;">
        <div class="l">کمترین تولید یک‌روزه (روزهای فعال)</div>
        <div class="v" style="color:#ffb0b8;">${minDay? fmt(mainFourTotal(minDay),0):'—'}</div>
        <div class="hint" style="margin-top:6px;">${minDay? esc(minDay.date)+' — '+esc(minDay.day):''}</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="flexbar"><h3 style="margin:0;">گزارش تجمیعی تولید روزانه</h3><button class="btn btn-ghost btn-sm" id="expProdCsv">خروجی CSV</button></div>
    <div class="table-wrap"><table>
      <thead><tr><th>تاریخ</th><th>روز</th><th class="num">خط۱</th><th class="num">خط۲</th><th class="num">خط۳</th><th class="num">خط۴</th>
      <th class="num">CKD</th><th class="num">سه‌راهی۲۰۶</th><th class="num">درپوش</th><th class="num">دیزل/بنز</th><th class="num">جمع کل</th><th class="num">هدف کل</th><th class="num">انحراف</th><th class="num">انحراف٪</th></tr></thead>
      <tbody>
      ${rows.length===0?`<tr><td colspan="14"><div class="tbl-empty">داده‌ای برای نمایش وجود ندارد.</div></td></tr>`:
      rows.map(e=>{
        const sAll = allLinesTotal(e); const dTarget = dayCombinedTarget(e); const dev = sAll-dTarget; const devp = dTarget? dev/dTarget:0;
        const c = (k)=> e.lines[k].status==='stop'?'<span class="badge badge-stop">توقف</span>':fmt(e.lines[k].qty,0);
        const cItem = (k, itemTarget)=>{
          if(e.lines[k].status==='stop') return '<span class="badge badge-stop">توقف</span>';
          const q = e.lines[k].qty;
          if(!itemTarget || q===null) return fmt(q,0);
          return `<span style="color:${q>=itemTarget?'#8ff0c8':'#ffb0b8'}">${fmt(q,0)}</span>`;
        };
        return `<tr><td>${esc(e.date)}</td><td>${esc(e.day)}</td>

          <td class="num">${cItem('ckd', ckdTarget)}</td><td class="num">${cItem('se206', se206Target)}</td><td class="num">${cItem('darpoosh', darpooshTarget)}</td><td class="num">${cItem('diesel', dieselTarget)}</td>
          <td class="num"><b>${fmt(sAll,0)}</b></td><td class="num">${fmt(dTarget,0)}</td>

  bindMonthBar(()=>renderProd());

  document.getElementById('saveTargetBtn').addEventListener('click', ()=>{
    const v = num(document.getElementById('targetInput').value);

    const ckdV = num(document.getElementById('ckdTargetInput').value);
    const se206V = num(document.getElementById('se206TargetInput').value);

    DB.meta.se206Target = se206V===null? 0 : Math.max(0, se206V);

    DB.meta.nominalCapacity = (nomV===null || nomV<=0)? 0 : Math.max(nomV, v);
    DB.meta.normalShiftHours = (normalShiftV===null || normalShiftV<=0)? 10 : normalShiftV;

  document.getElementById('expProdCsv').addEventListener('click', ()=>{
    const headers = ['تاریخ','روز','خط1','خط2','خط3','خط4','CKD','سه‌راهی206','درپوش','دیزل/بنز','جمع کل','هدف کل','انحراف','انحراف%'];
    const rr = rows.map(e=>{
      const sAll = allLinesTotal(e), dTarget = dayCombinedTarget(e), dev = sAll-dTarget;
      return [e.date,e.day, e.lines.line1.qty, e.lines.line2.qty, e.lines.line3.qty, e.lines.line4.qty,

    });
    downloadFile('گزارش-تولید.csv', toCSV(headers, rr), 'text/csv;charset=utf-8');
  });

  const allLinesDailyTotals = rows.map(e=>allLinesTotal(e));
  const combinedTarget = target4Lines() + ckdTarget + se206Target + darpooshTarget + dieselTarget;
  mkChart('chProdTrend', {
    type:'line',
    data:{ labels: rows.map(e=>e.date),
      datasets:[
        {label:'جمع کل تولید (همه اقلام)', data: allLinesDailyTotals, borderColor:'#ff9d42', backgroundColor:'rgba(255,157,66,.15)', fill:true, tension:.35, pointRadius:3},
        {label:'هدف', data: rows.map(e=>dayCombinedTarget(e)), borderColor:'#4c8dff', borderDash:[6,5], pointRadius:0, tension:0, noLabel:true},
      ]},
    options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
      plugins:{legend:{position:'bottom', labels:{boxWidth:10,padding:14}}},
      scales:{ x:{grid:{color:'#182338'}}, y:{grid:{color:'#182338'}} } }
  });
  mkChart('chProdByLine', {
    type:'bar',
    data:{ labels:['خط۱','خط۲','خط۳','خط۴','CKD','سه‌راهی۲۰۶','درپوش','دیزل/بنز'],
      datasets:[{ label:'جمع تولید', data:['line1','line2','line3','line4','ckd','se206','darpoosh','diesel'].map(k=>rows.reduce((s,e)=>s+(e.lines[k].qty||0),0)),

  });

    const stopMarkers = rows.map(e=> e.lines[d.key].status==='stop' ? 0 : null);

    ];

        scales:{ x:{grid:{display:false}, ticks:{font:{size:8.5}, maxRotation:0, autoSkip:true, maxTicksLimit:5}},
                 y:{grid:{color:'#182338'}, ticks:{font:{size:8.5}}} },

        onClick:(evt, els, chart)=>{
          const hit = els.find(el=> chart.data.datasets[el.datasetIndex].label==='⛔ توقف تولید');
